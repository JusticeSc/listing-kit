name: Product V2 CI and Docker CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 依赖索引由 pyproject.toml 固定为清华镜像；GitHub runner 到该镜像会偶发单请求超时
# （2026-10-08：run 37760499569 Docker 构建拉 pillow 12.3.0、run 37762306228 host uv sync 拉
# httpcore2 2.13.1，原文均为网络超时/重试耗尽）。这里只放宽安装期的 HTTP 超时与重试次数，
# 不改索引、不改锁定内容、不碰产品行为；失败仍按真实原因红，不靠重跑洗绿。
env:
  UV_HTTP_TIMEOUT: "300"
  UV_HTTP_RETRIES: "5"

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selected: ${{ steps.filter.outputs.selected }}
      frontend: ${{ steps.filter.outputs.frontend }}
      browser: ${{ steps.filter.outputs.browser }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked selection dependencies
        run: |
          python -m pip install uv==0.9.18
          uv sync --locked
      - name: Select affected checks and release closure
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            uv run --locked python tools/select_v2_checks.py --emit-github --github-output "$GITHUB_OUTPUT"
          else
            uv run --locked python tools/select_v2_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" \
              --emit-github --github-output "$GITHUB_OUTPUT"
          fi

  verify:
    name: Control plane and Product V2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    # PR/手动入口消费同一本地选择结果；main 复用已验PR，只按运行闭包构建发布。
    # changes 失败不能变成跳过验证后的部署许可。
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Fail required check when selection is unavailable
        if: always() && needs.changes.result != 'success'
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
        run: |
          echo "Impact selection did not succeed (${SELECTION_RESULT}); no verification or release is approved."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up locked frontend tools
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, MIT
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install approved frontend checker
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npm install --global "npm@$(node -p 'require("./package.json").engines.npm')" --ignore-scripts
          npm ci --ignore-scripts

      - name: Install uv and locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.18
          uv sync --locked

      - name: Install browser only for affected consumers
        if: needs.changes.outputs.browser == 'true'
        run: uv run --locked playwright install --with-deps chromium

      # 完整命令目录仍由本job唯一持有；选择器与最终两轮读取全部字面命令。
      - name: Check documentation
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/check_docs.py --no-run')
        run: uv run --locked python tools/check_docs.py --no-run
      - name: Check project state
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/check_project_state.py')
        run: uv run --locked python tools/check_project_state.py
      - name: Probe project state
        if: contains(fromJSON(needs.changes.outputs.selected), 'evals/probes/project_state.py')
        run: uv run --locked python evals/probes/project_state.py
      - name: Probe documentation routing
        if: contains(fromJSON(needs.changes.outputs.selected), 'evals/probes/docs_index.py')
        run: uv run --locked python evals/probes/docs_index.py
      - name: Check verification policy
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/check_verification.py')
        run: uv run --locked python tools/check_verification.py
      - name: Probe verification policy
        if: contains(fromJSON(needs.changes.outputs.selected), 'evals/probes/verification_policy.py')
        run: uv run --locked python evals/probes/verification_policy.py

      - name: Check frontend versions
        if: contains(fromJSON(needs.changes.outputs.selected), 'npm:check:versions')
        run: npm run check:versions
      - name: Build image envelope
        if: contains(fromJSON(needs.changes.outputs.selected), 'npm:build:envelope')
        run: npm run build:envelope
      - name: Check frontend types
        if: contains(fromJSON(needs.changes.outputs.selected), 'npm:check:types')
        run: npm run check:types
      - name: Build frontend
        if: contains(fromJSON(needs.changes.outputs.selected), 'npm:build:frontend')
        run: npm run build:frontend
      - name: Check image envelope
        if: contains(fromJSON(needs.changes.outputs.selected), 'npm:check:envelope')
        run: npm run check:envelope
      - name: Build Node consumers
        if: contains(fromJSON(needs.changes.outputs.selected), 'npm:build:frontend-node')
        run: npm run build:frontend-node
      - name: Check domain behavior
        if: contains(fromJSON(needs.changes.outputs.selected), 'npm:test:domain')
        run: npm run test:domain

      - name: Check formal entry
        if: contains(fromJSON(needs.changes.outputs.selected), 'app/server.py --check')
        run: uv run --locked python app/server.py --check
      - name: Check IndexedDB
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_1_1_indexeddb.py')
        run: uv run --locked python tools/verify_v2_1_1_indexeddb.py
      - name: Check project home
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_1_2_project_home.py')
        run: uv run --locked python tools/verify_v2_1_2_project_home.py
      - name: Check project package
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_1_3_project_package.py')
        run: uv run --locked python tools/verify_v2_1_3_project_package.py
      - name: Check formal entry consumers
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_1_4_formal_entry.py')
        run: uv run --locked python tools/verify_v2_1_4_formal_entry.py
      - name: Check product contracts
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_2_1_product_contracts.py')
        run: uv run --locked python tools/verify_v2_2_1_product_contracts.py
      - name: Check semantic provider
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_2_2_semantic_provider.py')
        run: uv run --locked python tools/verify_v2_2_2_semantic_provider.py
      - name: Check intake understanding
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_2_3_intake_understanding.py')
        run: uv run --locked python tools/verify_v2_2_3_intake_understanding.py
      - name: Check suite registry
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_1_suite_registry.py')
        run: uv run --locked python tools/verify_v2_3_1_suite_registry.py
      - name: Check suite editor
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_2_suite_editor.py')
        run: uv run --locked python tools/verify_v2_3_2_suite_editor.py
      - name: Check session lifecycle
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_3_session_lifecycle.py')
        run: uv run --locked python tools/verify_v2_3_3_session_lifecycle.py
      - name: Check specification versions
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_3_spec_versions.py')
        run: uv run --locked python tools/verify_v2_3_3_spec_versions.py
      - name: Check prompt compiler
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_4_prompt_compiler.py')
        run: uv run --locked python tools/verify_v2_3_4_prompt_compiler.py
      - name: Check pre-generation confirmation
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_5_pre_generation_confirm.py')
        run: uv run --locked python tools/verify_v2_3_5_pre_generation_confirm.py
      - name: Check manual prompt editing
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_6_prompt_manual_edit.py')
        run: uv run --locked python tools/verify_v2_3_6_prompt_manual_edit.py
      - name: Check copy adoption
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_7_copy_adoption_chain.py')
        run: uv run --locked python tools/verify_v2_3_7_copy_adoption_chain.py
      - name: Check specification OCC
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_3_8_spec_save_occ.py')
        run: uv run --locked python tools/verify_v2_3_8_spec_save_occ.py
      - name: Check gateway behavior
        if: contains(fromJSON(needs.changes.outputs.selected), 'pytest:tests/gateway -q')
        run: uv run --locked python -m pytest tests/gateway -q
      - name: Check developer commands
        if: contains(fromJSON(needs.changes.outputs.selected), 'pytest:tests/dev -q')
        run: uv run --locked python -m pytest tests/dev -q
      - name: Check generation attempts
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_4_2_generation_attempt.py')
        run: uv run --locked python tools/verify_v2_4_2_generation_attempt.py
      - name: Check batch execution
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_4_3_batch_execution.py')
        run: uv run --locked python tools/verify_v2_4_3_batch_execution.py
      - name: Check candidate bytes
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_4_4_candidate_blob.py')
        run: uv run --locked python tools/verify_v2_4_4_candidate_blob.py
      - name: Check deterministic review
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_5_1_deterministic_review.py')
        run: uv run --locked python tools/verify_v2_5_1_deterministic_review.py
      - name: Check VLM review
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_5_2_vlm_review.py')
        run: uv run --locked python tools/verify_v2_5_2_vlm_review.py
      - name: Check image adapters
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_r5_2_two_adapters.py')
        run: uv run --locked python tools/verify_v2_r5_2_two_adapters.py
      - name: Check comparison
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_5_3_compare_panel.py')
        run: uv run --locked python tools/verify_v2_5_3_compare_panel.py
      - name: Check rework
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_5_4_rework_loop.py')
        run: uv run --locked python tools/verify_v2_5_4_rework_loop.py
      - name: Check suite review
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_5_5_suite_review.py')
        run: uv run --locked python tools/verify_v2_5_5_suite_review.py
      - name: Check selection
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_6_1_selection.py')
        run: uv run --locked python tools/verify_v2_6_1_selection.py
      - name: Check delivery
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_6_2_delivery.py')
        run: uv run --locked python tools/verify_v2_6_2_delivery.py
      - name: Check project transfer
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_6_3_project_transfer.py')
        run: uv run --locked python tools/verify_v2_6_3_project_transfer.py
      - name: Check accessibility
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_6_4_accessibility.py')
        run: uv run --locked python tools/verify_v2_6_4_accessibility.py
      - name: Check interaction and visual behavior
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_ui_2_interaction_visual.py')
        run: uv run --locked python tools/verify_v2_ui_2_interaction_visual.py
      - name: Check frontend behavior
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_ui_3_frontend.py')
        run: uv run --locked python tools/verify_v2_ui_3_frontend.py
      - name: Check settings and vision
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_packet08_settings_vision.py')
        run: uv run --locked python tools/verify_v2_packet08_settings_vision.py
      - name: Check AI adoption
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_packet08_adoption_ai.py')
        run: uv run --locked python tools/verify_v2_packet08_adoption_ai.py
      - name: Check AI delivery
        if: contains(fromJSON(needs.changes.outputs.selected), 'tools/verify_v2_packet08_delivery_ai.py')
        run: uv run --locked python tools/verify_v2_packet08_delivery_ai.py

      - name: Reject verification side effects
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            echo "Verification changed tracked files or created non-ignored files."
            exit 1
          fi

  container:
    name: Docker image, smoke test, and main deploy
    needs: [verify, changes]
    # 只有成功选择及成功验证可继续；仅main push接受verify按事件有意跳过。
    # job保留required上下文，步骤再按运行/构建/发布闭包决定执行或如实记不适用。
    if: always() && needs.changes.result == 'success' && (needs.verify.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: amz-listing-kit
      CONTAINER_NAME: amz-listing-kit
      APP_PORT: "8780"
      APP_PUBLIC_IP: "47.115.172.233"
      APP_HTTPS_PORT: "8080"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up release acceptance tooling
        uses: actions/setup-python@v6
        if: needs.changes.outputs.container == 'true'
        with:
          python-version: "3.13"

      - name: Install locked acceptance dependencies
        if: needs.changes.outputs.container == 'true'
        run: |
          python -m pip install uv==0.9.18
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Report unchanged runtime and release closure
        if: needs.changes.outputs.container == 'false'
        run: echo "无运行/构建/发布闭包变化：容器链与部署不适用，未执行（非容器已验）。"

      - name: Build immutable image
        if: needs.changes.outputs.container == 'true'
        run: docker build --pull --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Smoke-test container health
        if: needs.changes.outputs.container == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-evidence
          docker run --detach --name amz-listing-kit-smoke --publish 127.0.0.1:8780:8780 "${IMAGE_NAME}:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' amz-listing-kit-smoke)"
            if [ "$status" = healthy ]; then
              python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8780/api/health", timeout=5) as response:
              body = json.load(response)
          assert body["product"] == "v2", body
          assert body["server_state"] == "none", body
          PY
              docker exec -i amz-listing-kit-smoke python - \
                --fingerprint --runtime-root . --base http://127.0.0.1:8780 \
                < tools/release_transaction_probe.py > release-evidence/candidate-runtime-fingerprint.json
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          docker logs amz-listing-kit-smoke
          exit 1

      - name: Remove smoke container
        if: always() && needs.changes.outputs.container == 'true'
        run: docker rm --force amz-listing-kit-smoke >/dev/null 2>&1 || true

      - name: Release transaction selftest (real disposable containers)
        if: needs.changes.outputs.container == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # PR 与 main push 都真实执行事务脚本与一次性容器（已批准的 Linux
          # Docker runner + 锁依赖 Playwright Chromium）；缺守护进程/拉取失败
          # 按 missing_prereq（exit 2）如实红，不伪造绿。远程发布前先过机制门。
          uv run --locked python tools/release_transaction_probe.py --selftest

      - name: Release failure classes (real script, no containers)
        if: needs.changes.outputs.container == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # 回滚真值表由**行为**证明，不扫描工作流自身文本：真实脚本 + 最小 stage 执行器
          # 逐个走失败类别——deploy 阶段失败自身回退；deploy 后验收/指纹类失败 →
          # rollback 恢复旧版本并清事务；finalize 重验证失败 exit 1 保留恢复点；
          # 清理失败 exit 4（新版本继续服务、previous 保留、绝不回滚）;回退本身失败
          # exit 3 且 journal 保留；全通过 exit 0 才清理 previous/备份。
          # 需要 bash（runner 自带）；不连 SSH、不碰发布环境。
          uv run --locked python tools/release_transaction_probe.py --offline-rollback

      - name: Prepare SSH
        if: needs.changes.outputs.container == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Sync provider secrets to server env file
        if: needs.changes.outputs.container == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # 第二 provider（火山 Ark，R4.3 只做运行环境接线；适配器本体属 R5.2）。
          ARK_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -z "${DASHSCOPE_API_KEY:-}" ] && [ -z "${ARK_API_KEY:-}" ]; then
            echo "两个 provider 密钥都未配置：跳过同步，远程容器按未配置 provider 运行。" >&2
            exit 0
          fi
          target="${SSH_USER}@${SSH_HOST}"
          staging="$(mktemp)"
          chmod 600 "$staging"
          trap 'rm -f -- "$staging"' EXIT
          {
            if [ -n "${DASHSCOPE_API_KEY:-}" ]; then printf 'DASHSCOPE_API_KEY=%s\n' "$DASHSCOPE_API_KEY"; fi
            if [ -n "${ARK_API_KEY:-}" ]; then printf 'ARK_API_KEY=%s\n' "$ARK_API_KEY"; fi
          } > "$staging"
          scp -o ConnectTimeout=15 "$staging" "$target:/tmp/amz-listing-kit-secrets.env"
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          staging="/tmp/amz-listing-kit-secrets.env"
          file="$HOME/.config/amz-listing-kit/app.env"
          install -d -m 700 "$HOME/.config/amz-listing-kit"
          touch "$file"
          tmp="$(mktemp)"
          grep -v -e '^DASHSCOPE_API_KEY=' -e '^ARK_API_KEY=' "$file" > "$tmp" || true
          cat "$staging" >> "$tmp"
          mv "$tmp" "$file"
          chmod 600 "$file"
          rm -f -- "$staging"
          echo "app.env 已更新：$(wc -l < "$file") 行（密钥值不回显）"
          REMOTE

      - name: Build on remote Docker and deploy (full release transaction)
        id: release_deploy
        if: needs.changes.outputs.container == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          target="${SSH_USER}@${SSH_HOST}"
          context="/tmp/amz-listing-kit-${GITHUB_SHA}"
          script="deploy/release-transaction.sh"
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" \
            "case '$context' in /tmp/amz-listing-kit-[0-9a-f]*) rm -rf -- '$context';; *) exit 2;; esac; install -d -m 700 '$context'"
          # 事务脚本随构建上下文一起上传：远程 deploy 入口先装一份到
          # ~/.config/amz-listing-kit/release-transaction.sh，供后续
          # finalize/rollback 会话复用同一身份与逻辑。
          # 上下文按目录整体上传，与 Dockerfile 的目录 COPY 和 .dockerignore 白名单对齐：
          # 不再字面钉单个源文件，避免新增运行文件漏传或旧文件被显式带入镜像。
          tar -czf - Dockerfile .dockerignore pyproject.toml uv.lock package.json package-lock.json \
            vite.config.mjs tsconfig.json tools app src config deploy \
            | ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" "tar -xzf - -C '$context'"
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" 'bash -s' -- \
            "${IMAGE_NAME}:${GITHUB_SHA}" "${CONTAINER_NAME}" "${APP_PORT}" "$context" \
            "${APP_PUBLIC_IP}" "${APP_HTTPS_PORT}" "$script" <<'REMOTE'
          set -Eeuo pipefail
          image="$1"
          name="$2"
          port="$3"
          context="$4"
          public_ip="$5"
          https_port="$6"
          script="$7"
          # 旧版本恢复点（完整事务语义见 deploy/release-transaction.sh）：
          # previous 应用容器与 Caddy 配置备份至少保留到容器健康、外部 HTTPS、
          # 静态资源与约定页面主链全部验收结束；提前删除 previous 是已核对的
          # 回退缺口，这里绝不提前删除。deploy 只做容器健康 + TLS 收敛 +
          # 受信 HTTPS 入口检查；静态资源/页面主链验收见后一步，全部通过才
          # finalize 清理；任一必要失败走 rollback 恢复上一已知可用状态。
          case "$context" in
            /tmp/amz-listing-kit-[0-9a-f]*) ;;
            *) echo "refusing unexpected build context: $context" >&2; exit 2 ;;
          esac
          bash "$context/$script" deploy "$image" "$name" "$port" "$context" \
            "$public_ip" "$https_port"
          REMOTE

      - name: Release acceptance (static assets and page main chain)
        id: release_acceptance
        if: needs.changes.outputs.container == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          # 受信 HTTPS 上的真实资源/页面验收：健康、能力、静态字节与已批准
          # Playwright 无头 Chromium 实际启动/状态就绪/主链，不带 BYOK、
          # 不做任何付费调用。失败绝不直接清理 previous，由下一步 rollback
          # 按事务身份恢复上一已知可用状态并核对实际可用性。
          uv run --locked python tools/release_transaction_probe.py --page-smoke \
            --base "https://${APP_PUBLIC_IP}:${APP_HTTPS_PORT}"

      - name: Verify runtime and configuration fingerprints before cleanup
        id: release_fingerprint
        if: needs.changes.outputs.container == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-evidence
          target="${SSH_USER}@${SSH_HOST}"
          # 在 previous 和配置备份仍存在时核对实际运行字节、不可变镜像 ID、
          # 受服 Caddy 配置与本轮源树；任何不一致进入同一真实回退门。
          # 只采集公开配置摘要，不读取 app.env、私钥或凭据。
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" \
            "docker exec -i '${CONTAINER_NAME}' python - --fingerprint --runtime-root . --base http://127.0.0.1:8780" \
            < tools/release_transaction_probe.py > release-evidence/runtime-fingerprint.json
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" \
            "docker inspect --format '{{.Image}} {{.Config.Image}}' '${CONTAINER_NAME}'" \
            > release-evidence/image.txt
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" \
            "docker exec '${CONTAINER_NAME}-tls' sha256sum /etc/caddy/Caddyfile" \
            > release-evidence/caddy.sha256
          uv run --locked python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          evidence = Path("release-evidence")
          data = json.loads((evidence / "runtime-fingerprint.json").read_text(encoding="utf-8"))
          assert data["schema_version"] == "amz-runtime-fingerprint/v2", "unexpected fingerprint schema"
          assert data["default_trial"] == "closed", "default trial must remain closed"
          assert re.fullmatch(r"[0-9a-f]{64}", data["runtime_sha256"])
          assert re.fullmatch(r"[0-9a-f]{64}", data["public_configuration_sha256"])
          # 构建资源逐项绑定到本job真实启动过的候选镜像；
          # 源码/配置另与checkout核对，不要求被忽略的dist存在于源码工作区。
          served = data["served_assets_sha256"]
          assert isinstance(served, dict) and served, "no served browser assets recorded"
          for resource, digest in served.items():
              assert re.fullmatch(r"[0-9a-f]{64}", digest), f"bad served script digest: {resource}"
          candidate = json.loads((evidence / "candidate-runtime-fingerprint.json").read_text(encoding="utf-8"))
          assert candidate["schema_version"] == data["schema_version"], "candidate schema differs"
          assert candidate["files"] == data["files"], "serving bytes differ from the CI-tested image"
          assert candidate["runtime_sha256"] == data["runtime_sha256"], "serving runtime differs"
          root = Path.cwd().resolve()
          for name, actual in data["files"].items():
              lowered = name.lower()
              assert "secret" not in lowered and "app.env" not in lowered, f"secret in fingerprint: {name}"
              source = (root / name).resolve()
              assert source.is_relative_to(root), f"invalid runtime path: {name}"
              if name.startswith("dist/product-v2/"):
                  continue  # 构建产物已逐字节绑定到本job构建且真实服务过的候选镜像。
              with source.open("rb") as stream:
                  expected = hashlib.file_digest(stream, "sha256").hexdigest()
              assert actual == expected, f"runtime/source mismatch: {name}"
          image_id, image_tag = (evidence / "image.txt").read_text(encoding="utf-8").split()
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", image_id), "missing immutable image ID"
          assert image_tag == f'{os.environ["IMAGE_NAME"]}:{os.environ["GITHUB_SHA"]}', "unexpected serving image"
          caddy = (evidence / "caddy.sha256").read_text(encoding="utf-8").split()[0]
          expected_caddy = hashlib.sha256(Path("deploy/caddy/Caddyfile").read_bytes()).hexdigest()
          assert caddy == expected_caddy, "serving TLS configuration differs from accepted source"
          (evidence / "release.json").write_text(json.dumps({
              "commit": os.environ["GITHUB_SHA"], "image_id": image_id, "image_tag": image_tag,
              "runtime_sha256": data["runtime_sha256"],
              "public_configuration_sha256": data["public_configuration_sha256"],
              "caddy_configuration_sha256": caddy,
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("runtime_sha256=" + data["runtime_sha256"])
          print("public_configuration_sha256=" + data["public_configuration_sha256"])
          print("image_id=" + image_id)
          print("caddy_configuration_sha256=" + caddy)
          PY

      - name: Finalize release (cleanup previous only after all acceptance)
        id: release_finalize
        if: needs.changes.outputs.container == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set +e
          target="${SSH_USER}@${SSH_HOST}"
          context="/tmp/amz-listing-kit-${GITHUB_SHA}"
          # 只有全部验收通过才走到 finalize：按事务身份核对镜像一致后，
          # 才删除 previous 与备份。finalize 仍重验容器健康 + 受信 HTTPS +
          # 静态首页/样式/脚本（任一失败 exit 1，事务保持开放，rollback 恢复）。
          # - 重验证失败（exit 1：新容器缺失/不健康、HTTPS/静态失败）是必要失败，
          #   事务保持开放，由 rollback 门恢复；
          # - 收尾失败（exit 4：新版本健康但删 previous/备份/事务文件失败，
          #   或无有效开放事务）绝不自动回滚，需人工清理。
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" "bash ~/.config/amz-listing-kit/release-transaction.sh finalize '${IMAGE_NAME}:${GITHUB_SHA}' '${CONTAINER_NAME}' '${APP_PORT}' '$context' '${APP_PUBLIC_IP}' '${APP_HTTPS_PORT}'"
          finalize_rc="$?"
          echo "release_finalize_rc=$finalize_rc"
          if [ "$finalize_rc" -eq 1 ]; then
            echo "recoverable=true" >> "$GITHUB_OUTPUT"
          else
            echo "recoverable=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$finalize_rc" -eq 4 ]; then
            echo "finalize_cleanup_failed: new version healthy, manual cleanup needed (exit 4)" >&2
          fi
          exit "$finalize_rc"

      - name: Upload candidate and release fingerprints
        if: always() && hashFiles('release-evidence/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Roll back to previous known working state
        if: failure() && needs.changes.outputs.container == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.release_deploy.outcome == 'failure' || steps.release_acceptance.outcome == 'failure' || steps.release_fingerprint.outcome == 'failure' || (steps.release_finalize.outcome == 'failure' && steps.release_finalize.outputs.recoverable == 'true'))
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          target="${SSH_USER}@${SSH_HOST}"
          context="/tmp/amz-listing-kit-${GITHUB_SHA}"
          # 任一必要环节失败都进入明确回退：恢复 previous 应用容器与
          # Caddy 配置并核对受信 HTTPS 实际可用。回退本身失败则报
          # unrecovered_failed_release（exit 3），绝不把失败报成成功。
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 "$target" "bash ~/.config/amz-listing-kit/release-transaction.sh rollback '${IMAGE_NAME}:${GITHUB_SHA}' '${CONTAINER_NAME}' '${APP_PORT}' '$context' '${APP_PUBLIC_IP}' '${APP_HTTPS_PORT}' acceptance_failed"
