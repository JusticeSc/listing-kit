name: Product V2 CI and Docker CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Control plane and Product V2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Check control plane
        run: |
          python tools/check_docs.py --no-run
          python tools/check_project_state.py
          python evals/probes/project_state.py

      - name: Check formal entry and browser contracts
        run: |
          python app/server.py --check
          python tools/verify_v2_1_1_indexeddb.py
          python tools/verify_v2_1_2_project_home.py
          python tools/verify_v2_1_3_project_package.py
          python tools/verify_v2_1_4_formal_entry.py
          python tools/verify_v2_2_1_product_contracts.py

      - name: Reject verification side effects
        run: git diff --exit-code

  container:
    name: Docker image, smoke test, and main deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: amz-listing-kit
      CONTAINER_NAME: amz-listing-kit
      APP_PORT: "8780"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build immutable image
        run: docker build --pull --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Smoke-test container health
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --detach --name amz-listing-kit-smoke --publish 127.0.0.1:8780:8780 "${IMAGE_NAME}:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' amz-listing-kit-smoke)"
            if [ "$status" = healthy ]; then
              python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8780/api/health", timeout=5) as response:
              body = json.load(response)
          assert body["product"] == "v2", body
          assert body["server_state"] == "none", body
          PY
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          docker logs amz-listing-kit-smoke
          exit 1

      - name: Remove smoke container
        if: always()
        run: docker rm --force amz-listing-kit-smoke >/dev/null 2>&1 || true

      - name: Prepare SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Transfer image and deploy with rollback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          target="${SSH_USER}@${SSH_HOST}"
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip | ssh "$target" 'gunzip | docker load'
          ssh "$target" 'bash -s' -- "${IMAGE_NAME}:${GITHUB_SHA}" "${CONTAINER_NAME}" "${APP_PORT}" <<'REMOTE'
          set -Eeuo pipefail
          image="$1"
          name="$2"
          port="$3"
          previous="${name}-previous"
          env_file="$HOME/.config/amz-listing-kit/app.env"

          docker image inspect "$image" >/dev/null
          docker rm --force "$previous" >/dev/null 2>&1 || true
          if docker container inspect "$name" >/dev/null 2>&1; then
            docker stop "$name" >/dev/null
            docker rename "$name" "$previous"
          fi

          run_args=(--detach --name "$name" --restart unless-stopped --publish "${port}:8780")
          if [ -f "$env_file" ]; then
            run_args+=(--env-file "$env_file")
          fi

          if ! docker run "${run_args[@]}" "$image"; then
            docker rename "$previous" "$name" >/dev/null 2>&1 || true
            docker start "$name" >/dev/null 2>&1 || true
            exit 1
          fi

          healthy=false
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
            if [ "$status" = healthy ]; then healthy=true; break; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker logs "$name" || true
            docker rm --force "$name" >/dev/null 2>&1 || true
            if docker container inspect "$previous" >/dev/null 2>&1; then
              docker rename "$previous" "$name"
              docker start "$name"
            fi
            exit 1
          fi

          docker rm --force "$previous" >/dev/null 2>&1 || true
          echo "deployed_image=$image host_port=$port health=healthy"
          REMOTE
