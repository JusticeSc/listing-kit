<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审核台 · 七坑位素材</title>
<!--
  审核台（本地 Web 单页）。零依赖、零构建 —— 与后端"标准库起服务"同构。

  它接的是**真实执行**：界面上的每一个数字都来自 /api/*，界面自己不做业务判断。
  三条纪律（写在这里，免得后来人顺手加"本地小状态"）：

    1. 界面**不推导业务结论**。张数、跳过、成本、版本号、已采纳 —— 一律读接口。
       在 JS 里重算一遍，就是这套系统里的第二个真相源。
    2. 界面上**不留假控件**。不能生效的东西不做成开关：素材行是只读事实
       （投递是目录约定）、内容计划条是只读展示（改文案要改商品包再重排文字层）。
       本项目已因"声明了没人读"返工三次，界面上同理。
    3. **形态**沿用 design-v2.html（那是定稿参照），这里只做接线。
-->
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBFAF7;color:#1F1E1C;
  font:13px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.bar{padding:13px 24px;border-bottom:.5px solid #E6E3DA;background:#fff}
.bar-t{font-size:15px;font-weight:500}
.bar-s{font-size:12px;color:#8A8880;margin-top:2px}
.steps{display:flex;gap:4px;padding:10px 24px;border-bottom:.5px solid #E6E3DA;background:#fff;
  position:sticky;top:0;z-index:20;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;font-size:12.5px;
  color:#5F5E5A;cursor:pointer;border:.5px solid transparent;user-select:none}
.step:hover{background:#F4F2EC}
.step.on{background:#E1F5EE;border-color:#9FE1CB;color:#04342C}
.step .n{width:18px;height:18px;border-radius:50%;background:#EDEBE4;color:#5F5E5A;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.step.on .n{background:#1D9E75;color:#fff}
main{padding:22px 24px 104px;max-width:1150px;margin:0 auto}
h1{font-size:17px;font-weight:500;margin:0}
h2{font-size:13.5px;font-weight:500;margin:0}
.sub{font-size:12.5px;color:#8A8880;margin-top:3px}
.head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:200px}
.card{background:#fff;border:.5px solid #E6E3DA;border-radius:12px}
.pad{padding:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dim{color:#8A8880}.tiny{font-size:11.5px}.small{font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.note{background:#F4F2EC;border:.5px solid #E6E3DA;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#5F5E5A}
.note.ok{background:#E1F5EE;border-color:#9FE1CB;color:#085041}
.note.warn{background:#FAEEDA;border-color:#FAC775;color:#633806}
.note.bad{background:#FCEBEB;border-color:#F7C1C1;color:#791F1F}
.btn{border:.5px solid #D8D5CC;background:#fff;color:#1F1E1C;border-radius:8px;padding:6px 13px;
  font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{background:#F4F2EC}
.btn.primary{background:#0F6E56;border-color:#0F6E56;color:#fff}
.btn.primary:hover{background:#0B5A46}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:2px 7px;font-size:11px}
.btn.on{background:#E1F5EE;border-color:#9FE1CB;color:#04352C}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:11.5px;
  border:.5px solid #E6E3DA;background:#F4F2EC;color:#5F5E5A;white-space:nowrap}
.chip.teal{background:#E1F5EE;border-color:#9FE1CB;color:#085041}
.chip.amber{background:#FAEEDA;border-color:#FAC775;color:#633806}
.chip.red{background:#FCEBEB;border-color:#F7C1C1;color:#791F1F}
.chip.blue{background:#E6F1FB;border-color:#B5D4F4;color:#0C447C}
.sw{width:34px;height:19px;border-radius:999px;background:#DCD9D0;position:relative;cursor:pointer;
  flex:0 0 auto;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.sw.on{background:#1D9E75}
.sw.on i{left:17px}
.sw.lock{background:#C9E8DC;cursor:not-allowed;opacity:.75}
.matrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:.5px solid #F1EFE8}
.matrow:last-child{border-bottom:0}
.grp{font-size:11.5px;color:#A9A79F;letter-spacing:.04em;margin:2px 0 2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:11.5px;color:#8A8880;padding:9px 10px;border-bottom:.5px solid #E6E3DA}
td{padding:10px;border-bottom:.5px solid #F1EFE8;vertical-align:middle;font-size:12.5px}
tr:last-child td{border-bottom:0}
tr.off td{opacity:.42}
tr.off td.keep{opacity:1}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.scard{background:#fff;border:.5px solid #E6E3DA;border-radius:12px;overflow:hidden;position:relative}
.scard.focus{border-color:#0F6E56;box-shadow:0 0 0 2px rgba(15,110,86,.14)}
.scard.off{opacity:.45}
.scard.pend{opacity:.62}
.shd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:.5px solid #F1EFE8}
.shd .no{font-family:ui-monospace,monospace;font-size:11px;color:#A9A79F}
.shd .nm{font-size:12.5px;font-weight:500}
.thumb{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:#F4F2EC}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .cap{position:absolute;left:8px;bottom:7px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.5);
  padding:1px 6px;border-radius:4px}
.thumb .ph{font-size:12px;color:#8A8880;text-align:center;padding:0 12px;line-height:1.7}
.sft{display:flex;gap:6px;padding:9px 10px;border-top:.5px solid #F1EFE8;align-items:center}
.sft .btn{flex:1;text-align:center}
.vsel{display:flex;gap:4px;padding:6px 10px;border-top:.5px solid #F1EFE8;flex-wrap:wrap;align-items:center}
.opt{display:flex;align-items:center;gap:12px;border:.5px solid #E6E3DA;border-radius:10px;padding:11px 13px;
  cursor:pointer;background:#fff}
.opt:hover{background:#F9F8F4;border-color:#D8D5CC}
.opt.hi{border-color:#FAC775;background:#FAEEDA}
.ot{font-size:12.5px;font-weight:500}
.od{font-size:11.5px;color:#8A8880;margin-top:2px}
.oc{font-size:11.5px;white-space:nowrap;padding:2px 8px;border-radius:999px}
.oc.free{background:#E1F5EE;color:#085041}
.oc.cost{background:#FAEEDA;color:#633806}
.overlay{position:fixed;inset:0;background:rgba(28,26,22,.42);display:flex;align-items:center;
  justify-content:center;padding:22px;z-index:60}
.modal{background:#fff;border-radius:14px;padding:18px;width:min(560px,94vw);max-height:88vh;overflow:auto}
.kv{display:flex;gap:10px;padding:4px 0;font-size:12.5px}
.kv .k{width:88px;color:#8A8880;flex:0 0 auto}
.kv .v{flex:1 1 auto;word-break:break-all}
.bar-track{height:6px;background:#EDEBE4;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:999px;transition:width .18s linear}
@keyframes slide{from{background-position:0 0}to{background-position:26px 0}}
.bar-fill.run{width:100%;animation:slide .75s linear infinite;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.38) 0 13px,rgba(255,255,255,0) 13px 26px);
  background-size:26px 100%}
.prrow{display:grid;grid-template-columns:126px 1fr 104px;gap:12px;align-items:center;padding:7px 0}
.tag{font-family:ui-monospace,monospace;font-size:10.5px;color:#5F5E5A;background:#F4F2EC;
  border:.5px solid #E6E3DA;border-radius:5px;padding:1px 6px}
.seam{border-left:2px solid #1D9E75;padding-left:9px}
.seam.amber{border-color:#EF9F27}
.seam.gray{border-color:#B4B2A9}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  border:.5px solid #D8D5CC;background:#fff;cursor:pointer;font-size:12px;user-select:none}
.pill:hover{background:#F4F2EC}
.pill.on{background:#E1F5EE;border-color:#9FE1CB;color:#04352C}
.swatch{width:22px;height:22px;border-radius:6px;border:.5px solid #D8D5CC;display:inline-block;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1F1E1C;color:#fff;
  padding:9px 17px;border-radius:9px;font-size:12.5px;z-index:200;max-width:min(680px,88vw);
  line-height:1.5;opacity:0;transition:opacity .16s;pointer-events:none}
.logbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:.5px solid #E6E3DA;
  padding:9px 24px;display:flex;align-items:center;gap:12px;font-size:12px;z-index:40;flex-wrap:wrap}
.logline{font-family:ui-monospace,monospace;font-size:11px;padding:2px 0;border-bottom:.5px solid #F6F4EE;
  word-break:break-all;color:#5F5E5A}
.logline b{color:#1F1E1C;font-weight:500}
.kbd{border:.5px solid #D8D5CC;border-radius:5px;padding:0 5px;font-family:ui-monospace,monospace;
  font-size:11px;background:#F9F8F4}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-t" id="bar-t">审核台</div>
  <div class="bar-s" id="bar-s">本地服务 · 素材不出网 · 数据全部来自真实执行</div>
</div>
<nav class="steps" id="steps"></nav>
<main id="view"><div class="card pad"><div class="tiny dim">正在读取坑位表…</div></div></main>
<div id="modal-root"></div>
<div id="toast"></div>
<div class="logbar" id="logbar"></div>

<script>
/* ================================================================ 展示文案
   素材名与背景取值的"人话"是纯展示层的东西，所以放在界面里；
   取值集合本身来自 /api/table（kinds / slots[].needs），不在这里重复声明。
   缺一条就回落显示原名 —— 认不出的东西**显示原名**，不静默消失。          */
const KIND = {front:"正面原片", closeup:"特写原片", contents:"内容物原片",
              competitor:"竞品图", bullets:"卖点文案", specs:"规格参数"};
const KIND_NOTE = {
  front:"主体唯一事实来源；主图 / 卖点 / 规格 / 场景 都要它",
  closeup:"细节图必需 —— 螺纹 / 接缝 / 材质",
  contents:"内容物图必需 —— 包装盒 + 配件",
  competitor:"对比图必需；不得让模型画一个",
  bullets:"卖家写的断言，工具不代写",
  specs:"容量 / 尺寸 / 材质 —— 规格图数字的唯一来源"
};
const BG = {pure_white:"纯白底", palette:"色板底", generated:"生成背景", from_photo:"实拍原片"};
const KIND_OF = k => KIND[k] || k;
const BG_OF  = b => BG[b] || b || "—";

/* ================================================================ 状态
   ★ 只有"界面自己的东西"（当前步骤、展开哪个面板、选着看哪一版）留在这里。
     业务事实一律 S.plan / S.state —— 它们是接口给的。                        */
const S = {
  step: 1,
  table: null, products: [], productPath: null,
  plan: null,                    // /api/plan 的 plan
  only: {},                      // 界面选择：slot_id -> 本次做不做（真参数，映射 only）
  runId: null, state: null, phase: "idle", lines: [], jobError: null,
  focus: null, viewSeq: {},      // 焦点坑位 / 每格选着看的那一版
  redoFor: null, detailFor: null, showLog: false,
  poll: null, t0: 0
};

/* ================================================================ 工具 */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s)
  .replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chip = (t,c) => `<span class="chip ${c||""}">${esc(t)}</span>`;
const fileUrl = p => "/api/file?path=" + encodeURIComponent(p);
const baseName = p => String(p||"").split(/[\\/]/).pop();

function toast(m){
  const e = $("#toast"); e.textContent = m; e.style.opacity = "1";
  clearTimeout(toast._t); toast._t = setTimeout(()=>e.style.opacity="0", 5200);
}

async function api(path, body){
  const opt = body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)};
  let r, j;
  try { r = await fetch(path, opt); }
  catch(e){ throw new Error("连不上本地服务：" + e.message); }
  try { j = await r.json(); }
  catch(e){ throw new Error("HTTP " + r.status + "（响应不是 JSON）"); }
  if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ================================================================ 取数（界面只读，不推导） */
const slotsTable = () => (S.table && S.table.slots) || [];
const slotRow = id => slotsTable().find(s => s.slot_id === id) || {};
const decRow  = id => ((S.plan && S.plan.decisions) || []).find(d => d.slot_id === id) || {};
const stRow   = id => ((S.state && S.state.slots) || []).find(s => s.slot_id === id) || null;
const doableIds = () => ((S.plan && S.plan.decisions) || [])
                        .filter(d => d.status === "will_run").map(d => d.slot_id);
const pickedIds = () => doableIds().filter(id => S.only[id] !== false);
const doneSlots = () => ((S.state && S.state.slots) || []).filter(s => s.status === "done");
const shownSeq = s => S.viewSeq[s.slot_id] || (s.latest && s.latest.seq);
const shownVer = s => (s.versions || []).find(v => v.seq === shownSeq(s)) || s.latest;

async function boot(){
  try {
    S.table = await api("/api/table");
    S.products = (await api("/api/products")).products;
    if (S.products.length) await pickProduct(S.products[0].path);
    else render();
  } catch(e){
    $("#view").innerHTML = `<div class="note bad">启动失败：${esc(e.message)}</div>`;
  }
}

async function pickProduct(p){
  S.productPath = p;
  S.only = {}; S.runId = null; S.state = null; S.phase = "idle"; S.lines = [];
  S.jobError = null; S.viewSeq = {}; S.focus = null; S.detailFor = null; S.redoFor = null;
  S.plan = (await api("/api/plan?product=" + encodeURIComponent(p))).plan;
  const info = S.products.find(x => x.path === p);
  // 这个包之前跑过 → 直接把那一轮拉进来（CLI 跑完、审核台打开就能审）
  if (info && info.latest_run) await loadRun(info.latest_run);
  render();
}

async function loadRun(id){
  const j = await api("/api/runs/" + encodeURIComponent(id) + "/status");
  S.runId = id; S.state = j.state; S.phase = j.phase;
  S.lines = j.lines || []; S.jobError = j.error;
  if (j.phase === "running" || j.phase === "unknown") startPoll();
}

/* 轮询：一次调用同时拿"现在跑到哪"（lines）与"已经成了什么样"（state）
   —— 所以界面没有第二个状态源，刷新页面得到的也是同一个事实。               */
function startPoll(){
  stopPoll(); S.t0 = S.t0 || Date.now();
  S.poll = setInterval(async ()=>{
    try {
      const j = await api("/api/runs/" + encodeURIComponent(S.runId) + "/status");
      S.state = j.state; S.phase = j.phase; S.lines = j.lines || []; S.jobError = j.error;
      render();
      if (j.phase === "done" || j.phase === "error"){
        stopPoll(); S.t0 = 0;
        if (j.error) toast("未完成：" + j.error);
        else { toast("已完成。"); S.step = 4; render(); }
      }
    } catch(e){ stopPoll(); toast(e.message); }
  }, 700);
}
function stopPoll(){ if (S.poll) clearInterval(S.poll); S.poll = null; }

/* ================================================================ 片段 */
function srcChips(row){
  const out = [];
  if ((row.needs||[]).includes("front")) out.push(chip("主体","teal"));
  (row.cuts||[]).forEach(c => out.push(chip(KIND_OF(c),"red")));
  if ((row.needs||[]).includes("closeup")) out.push(chip("特写原片","red"));
  out.push(chip(BG_OF(row.background), row.background === "generated" ? "amber" : "blue"));
  if ((row.text||"none") !== "none") out.push(chip("叠字"));
  return out.join(" ");
}

function thumbHtml(s){
  if (!s.versions || !s.versions.length)
    return `<div class="thumb"><div class="ph">${s.status === "skipped" ? "缺料跳过" : "待生成"}</div></div>`;
  const cur = shownVer(s);
  const mark = cur.placeholder ? "占位图（无 key）" : "第 " + cur.seq + " 版";
  return `<div class="thumb">
    <img src="${fileUrl(cur.path)}" alt="" data-img-fallback="${esc(cur.file || "")}">
    <span class="cap">${esc(mark)}</span></div>`;
}

function slotCard(s){
  const row = slotRow(s.slot_id);
  const v = s.latest;
  const vs = (s.versions||[]).length > 1
    ? `<div class="vsel"><span class="tiny dim">对比</span>` +
      s.versions.map(x => `<button class="btn xs ${x.seq === shownSeq(s) ? "on" : ""}"
        data-act="view" data-id="${s.slot_id}" data-seq="${x.seq}">v${x.seq}${x.placeholder ? " ⚠" : ""}</button>`).join("")
      + `<span class="grow"></span><span class="tiny ${s.accepted ? "" : "dim"}">${
        s.accepted ? "已采纳 v" + s.accepted_seq : "待审"}</span></div>`
    : "";
  return `<div class="scard ${S.focus === s.slot_id ? "focus" : ""}" data-act="focus" data-id="${s.slot_id}">
    <div class="shd"><span class="no">0${s.slot_id}</span>
      <span class="nm">${esc(s.purpose || "")}</span><span class="grow"></span>
      ${row.calls_model ? chip("调模型","amber") : chip("零调用","")}</div>
    <div data-act="detail" data-id="${s.slot_id}" style="cursor:pointer">${thumbHtml(s)}</div>
    ${vs}
    <div class="sft">
      <button class="btn sm" data-act="redo" data-id="${s.slot_id}"
        ${(s.layers||[]).length ? "" : "disabled"}>重做</button>
      <button class="btn sm ${s.accepted ? "" : "primary"}" data-act="accept" data-id="${s.slot_id}">
        ${s.accepted ? "已采纳" : "采纳"}</button>
    </div>
  </div>`;
}

/* ================================================================ 顶栏 / 步骤条 / 日志条 */
const STEPS = [[1,"收件"],[2,"齐套判定"],[3,"生成"],[4,"审核台"],[5,"控制面"]];

function vBar(){
  const p = S.plan, st = S.state;
  const t = $("#bar-t"), sub = $("#bar-s");
  if (!p){ t.textContent = "审核台"; sub.textContent = "本地服务 · 素材不出网"; return; }
  const c = (st && st.counts) || {};
  const allAcc = c.done > 0 && c.accepted === c.done;
  t.innerHTML = `${esc(p.upc || "—")}　<span class="dim" style="font-weight:400">${
      esc(p.title || "")} · ${esc(S.table.catalog_label || "")} · ${esc(S.table.site)}</span>`
    + (st ? `　${allAcc ? chip("可导出","teal") : chip("待审 " + (c.done - c.accepted) + " / " + c.done,"amber")}` : "");
  sub.textContent = st
    ? `运行 ${st.run_id} · 产出 ${c.done} 张（跳过 ${c.skipped}） · 重做 ${c.redo} 次 · 模型调用 实际${
        c.model_calls_used == null
          ? (st.finished ? "未记录（旧格式的 run）" : "未记录（这一轮没跑到结束）")
          : c.model_calls_used} 次`
    : `${S.productPath || ""} · 还没跑过`;
}

function vSteps(){
  const p = S.plan;
  const tail = p ? `可做 ${doableIds().length} 张 · 本次将生成 ${pickedIds().length} 张 · 模型调用 ${
      pickedIds().filter(id => slotRow(id).calls_model).length ? 1 : 0} 次` : "";
  $("#steps").innerHTML = STEPS.map(([n,t]) =>
    `<div class="step ${S.step === n ? "on" : ""}" data-act="step" data-n="${n}">
       <span class="n">${n}</span>${t}${
       n === 4 && S.state && S.state.counts && S.state.counts.done
         ? `<span class="tiny">${S.state.counts.accepted}/${S.state.counts.done}</span>` : ""}</div>`
    ).join("") + `<span class="grow"></span><span class="tiny dim" style="padding:6px 2px">${esc(tail)}</span>`;
}

function vLogBar(){
  const st = S.state, c = (st && st.counts) || {};
  $("#logbar").innerHTML = st
    ? `${c.done} 张已落盘 / 跳过 ${c.skipped} · 模型调用 实际${
         c.model_calls_used == null
           ? (st.finished ? "未记录" : "未记录（没跑到结束）")
           : c.model_calls_used} 次（计划 ${
         c.model_calls_declared == null ? "—" : c.model_calls_declared}）· 重做 ${c.redo} 次`
      + (S.phase === "running" ? ` · <span style="color:#8A6A20">进行中…</span>` : "")
      + `<span class="grow"></span>
         <button class="btn xs" data-act="showlog">展开 run.jsonl</button>
         <span class="tiny dim mono">${esc(st.run_id)}</span>`
    : `还没有运行。产物与日志在 <span class="mono">out/&lt;UPC&gt;_&lt;时间戳&gt;/</span> 下
       —— <b style="font-weight:500">日志就是唯一的权威状态源</b>，界面上的数字都是它的派生。`;
}

/* ================================================================ 第 1 步 · 收件 */
function v1(){
  if (!S.plan) return `<div class="card pad"><div class="tiny dim">正在算齐套…</div></div>`;
  const p = S.plan, e0 = p.e0 || {};
  const groups = {影像素材:[], 事实字段:[]};
  S.table.kinds.forEach(k => {
    ((S.table.image_kinds || []).includes(k) ? groups.影像素材 : groups.事实字段).push(k);
  });
  const matHtml = Object.entries(groups).filter(([,l]) => l.length).map(([g,list]) =>
    `<div class="grp">${esc(g)}</div>` + list.map(k => {
      const has = !!p.supplied[k], brk = p.broken[k];
      const f = (e0.images || {})[k];
      const extra = f && f.readable ? ` ${f.width}×${f.height}` : (f && !f.readable ? " 不可读" : "");
      return `<div class="matrow">
        <span class="sw ${has ? "on" : "lock"}"><i></i></span>
        <div class="grow"><div class="small">${esc(KIND_OF(k))}</div>
          <div class="tiny dim">${esc(KIND_NOTE[k] || "")}</div></div>
        ${has ? chip(baseName(p.supplied[k]) + extra, "teal")
              : brk ? chip("填了但文件不在", "red") : chip("缺", "red")}
      </div>`;
    }).join("")).join("");

  const blocked = (p.decisions || []).filter(d => d.status === "skipped");
  const prodHtml = S.products.map(x =>
    `<div class="pill ${x.path === S.productPath ? "on" : ""}" data-act="product" data-p="${esc(x.path)}">
      <span class="mono">${esc(x.upc || "?")}</span> ${esc(x.title || "")}
      ${x.latest_run ? chip("跑过", "teal") : ""}</div>`).join(" ");

  return `
  <div class="head"><div class="grow"><h1>第 1 步 · 收件</h1>
    <div class="sub">一个商品 = 一个包。<b style="font-weight:500">包里放着几张原片，
      直接决定最后能出几张图</b> —— 这是整条链路上最靠前的一个约束。</div></div></div>

  <div class="note">
    <b style="font-weight:500">投递是目录约定，界面不设上传表单</b>（使用形态 §1）。
    把商品包放进 <span class="mono">${esc((S.table.product_dirs || []).join("/"))}/</span>，刷新即可见：
    运营已有的习惯就是"文件夹里放图"，不让他学新东西。下面这些素材行是
    <b style="font-weight:500">只读事实</b> —— 有没有素材，由包里的
    <span class="mono">assets{}</span> 与文件是否真的存在决定，不是界面上的开关。
  </div>

  <div class="row mt16">${prodHtml || '<span class="tiny dim">投递目录里没有商品包。</span>'}</div>

  <div class="mt16" style="display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start">
    <div class="card pad">
      <h2>商品包</h2>
      <div class="mt12">
        <div class="kv"><span class="k">包</span><span class="v mono">${esc(S.productPath)}</span></div>
        <div class="kv"><span class="k">UPC</span><span class="v mono">${esc(p.upc || "—")}</span></div>
        <div class="kv"><span class="k">标题</span><span class="v">${esc(p.title || "—")}</span></div>
        <div class="kv"><span class="k">类目 / 站点</span><span class="v">${esc(S.table.catalog_label || "")} · ${esc(S.table.site)}</span></div>
      </div>
      <div class="mt16" style="border-top:.5px solid #F1EFE8;padding-top:10px">${matHtml}</div>
    </div>

    <div>
      <div class="card pad">
        <h2>实时结论</h2>
        <div class="mt12" style="display:flex;gap:22px;flex-wrap:wrap">
          <div><div class="tiny dim">坑位表</div>
            <div style="font-size:22px;font-weight:500">${p.table_total}<small style="font-size:12px;color:#8A8880"> 个</small></div></div>
          <div><div class="tiny dim">素材齐套 → 可做</div>
            <div style="font-size:22px;font-weight:500;color:#0F6E56">${doableIds().length}<small style="font-size:12px;color:#8A8880"> 张</small></div></div>
          <div><div class="tiny dim">缺料跳过</div>
            <div style="font-size:22px;font-weight:500;color:${blocked.length ? "#A32D2D" : "#8A8880"}">${blocked.length}<small style="font-size:12px;color:#8A8880"> 张</small></div></div>
          <div><div class="tiny dim">模型调用</div>
            <div style="font-size:22px;font-weight:500;color:${p.model_calls ? "#8A6A20" : "#8A8880"}">${p.model_calls}<small style="font-size:12px;color:#8A8880"> 次</small></div></div>
        </div>
        <div class="note mt16">张数是<b style="font-weight:500">算出来的</b>，不是配置项 ——
          它 = 坑位表 ∩ 素材齐套。你手上的素材变了，这个数就变。</div>
      </div>

      ${p.rejected ? `<div class="note bad mt16"><b style="font-weight:500">整批拒绝：</b>${esc(p.rejected)}
        <div class="tiny mt8">工具修不了不合格的输入 —— 在入口拦，不等出口报错。</div></div>` : ""}

      ${(e0.attest_missing || []).length ? `<div class="note warn mt16">
        <b style="font-weight:500">合规签字还差 ${e0.attest_missing.length} 条：</b>
        <span class="mono">${esc((e0.attest_missing || []).join("、"))}</span>
        <div class="tiny mt8">这几项工具判不了（水印 / 道具 / 主体完整 / 角度 / 字体授权 / 竞品图干净）。
          真跑会被拦下（干跑不受限）—— 要在商品包的
          <span class="mono">attest.confirmed</span> 里逐条确认。</div></div>`
        : (e0.attest && (e0.attest.confirmed || []).length ? `<div class="note ok mt16">
            <b style="font-weight:500">人工签字齐了</b>（签字人 ${esc(e0.attest.by || "（未署名）")}
            ${esc(e0.attest.date || "")}）—— 落进 plan.json / run.jsonl，可事后审计。</div>` : "")}

      <div class="card pad mt16">
        <h2>${blocked.length ? "缺料导致跳过的坑位" : "素材齐套，无跳过"}</h2>
        <div class="mt12">
          ${blocked.length ? blocked.map(d => `
            <div class="row" style="padding:8px 0;border-bottom:.5px solid #F1EFE8">
              <span class="mono dim">0${d.slot_id}</span>
              <span class="small" style="width:72px">${esc(d.purpose || "")}</span>
              <span class="grow tiny dim">需要：${esc((d.missing || []).map(KIND_OF).join(" + "))}</span>
              ${chip("跳过 · 缺料", "red")}</div>`).join("")
            : `<div class="tiny dim">全部 ${p.table_total} 个坑位都有素材支撑。</div>`}
        </div>
        <div class="note warn mt16">
          <b style="font-weight:500">没有"让模型凑一张"这个选项。</b>
          细节的特写、内容物的包装、对比的竞品 —— 这三样都是<b style="font-weight:500">事实</b>，
          缺了就是缺了，只能补拍或跳过。凑一张假图比缺图更贵，它花的是信任。
        </div>
      </div>

      ${(e0.notices || []).length ? `<div class="card pad mt16">
        <h2>E0 体检提醒（${e0.notices.length} 条，不拦）</h2>
        <div class="mt12">${e0.notices.map(n => `<div class="tiny dim" style="padding:3px 0">· ${esc(n)}</div>`).join("")}</div>
        <div class="tiny dim mt12">体检只对<b style="font-weight:500">将要进入链路</b>的东西负责 ——
          没提供的素材属于"跳过"，不属于"体检"。</div></div>` : ""}
    </div>
  </div>`;
}

/* ================================================================ 第 2 步 · 齐套判定 */
function v2(){
  if (!S.plan) return `<div class="card pad"><div class="tiny dim">正在算齐套…</div></div>`;
  const p = S.plan;
  const rows = (p.decisions || []).map(d => {
    const row = slotRow(d.slot_id);
    const on = S.only[d.slot_id] !== false;
    const status = d.status === "skipped" ? chip("跳过 · 缺料", "red")
                 : (on ? chip("要生成", "teal") : chip("本次不做", ""));
    return `<tr class="${d.status === "will_run" && on ? "" : "off"}">
      <td class="keep mono dim">0${d.slot_id}</td>
      <td class="keep"><div class="small">${esc(d.purpose || "")}</div>
        <div class="tiny dim" style="max-width:330px">${esc(row.renderer_summary || "")}</div></td>
      <td class="keep">${srcChips(row)}</td>
      <td class="keep">${(row.needs || []).map(k =>
        chip(KIND_OF(k), (d.missing || []).includes(k) ? "red" : "teal")).join(" ")}</td>
      <td class="keep">${row.calls_model ? chip("调模型", "amber") : chip("零调用", "")}</td>
      <td class="keep">${status}</td></tr>`;
  }).join("");
  const n = (p.decisions || []).length;
  return `
  <div class="head"><div class="grow"><h1>第 2 步 · 齐套判定</h1>
    <div class="sub">每个坑位先声明"我要什么像素"，再拿商品包逐个对。
      <b style="font-weight:500">决策在这里发生，生成只是执行。</b></div></div></div>

  <div class="note ok">结论：${n} 个坑位里 <b style="font-weight:500">${doableIds().length} 个可做</b>
    （其中 <b style="font-weight:500">${doableIds().filter(i => slotRow(i).calls_model).length} 个调模型</b>），
    ${n - doableIds().length} 个因缺料跳过。</div>

  <div class="card mt16" style="overflow:hidden">
    <table><thead><tr>
      <th style="width:44px">#</th><th style="width:300px">用途 / 像素怎么来</th>
      <th style="width:240px">像素来源</th><th style="width:190px">需要素材</th>
      <th style="width:80px">成本</th><th>本次状态</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div>

  <div class="mt16" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px">
    <div class="card pad"><div class="seam"><h2>接缝 ③ · 坑位表</h2>
      <div class="tiny dim mt8">加一个坑位 = <span class="mono">config/slots.yaml</span> 里加一行。
        <b style="font-weight:500">执行器代码不动。</b>上面这张表本身就是配置面。</div></div></div>
    <div class="card pad"><div class="seam"><h2>接缝 ② · renderer 注册表</h2>
      <div class="tiny dim mt8">"像素来源"那一列填的是 renderer 名。换做法 = 加一个文件 + 登记一个键
        （<span class="mono">src/renderers/</span> 目录扫描，不用改清单）。</div></div></div>
    <div class="card pad"><div class="seam gray"><h2>不变骨架</h2>
      <div class="tiny dim mt8">遍历表 → 齐套校验 → 按 renderer 分派 → 扇出。
        <b style="font-weight:500">这里没有 <span class="mono">if slot == 4</span>。</b></div></div></div>
  </div>`;
}

/* ================================================================ 第 3 步 · 生成 */
function v3(){
  if (!S.plan) return `<div class="card pad"><div class="tiny dim">正在算齐套…</div></div>`;
  const running = S.phase === "running";
  const thumbBg = {compose_white:"#fff", flat_overlay:"#F2F0EA", gen_bg_paste:"#EFE1D2",
                   closeup_crop:"#DDD7CC", contents_compose:"#fff", compare_side:"#F7F5F0"};

  const cards = (S.plan.decisions || []).map(d => {
    const row = slotRow(d.slot_id);
    const doable = d.status === "will_run";
    const on = S.only[d.slot_id] !== false;
    const must = !!row.mandatory;
    return `<div class="scard ${!doable || !on ? "off" : ""}">
      <div class="shd"><span class="no">0${d.slot_id}</span>
        <span class="nm">${esc(d.purpose || "")}</span><span class="grow"></span>
        <span class="sw ${on && doable ? "on" : ""} ${must ? "lock" : ""}"
          ${must || !doable || running ? "" : `data-act="pick" data-id="${d.slot_id}"`}><i></i></span></div>
      <div class="thumb" style="background:${thumbBg[d.renderer] || "#F4F2EC"}">
        <div class="ph">${doable
          ? esc(row.renderer_label || d.renderer) + "<br><span class=\"tiny\">"
            + esc(BG_OF(row.background)) + (row.calls_model ? " · 等模型" : " · 秒级") + "</span>"
          : "缺 " + esc((d.missing || []).map(KIND_OF).join("、"))}</div>
        <span class="cap">${esc(row.renderer_label || d.renderer)}</span></div>
      <div class="sft">${!doable ? `<span class="tiny dim">缺料跳过</span>`
        : must ? `<span class="tiny dim">平台强制项 · 不可关</span>`
        : `<span class="tiny dim">${on ? "计入本次" : "本次不做"}</span>`}</div>
    </div>`;
  }).join("");

  const run = pickedIds();
  const pr = run.map(id => {
    const row = slotRow(id);
    const s = stRow(id), v = s && s.latest;
    const isModel = !!row.calls_model;
    const stTxt = v ? ("完成 · " + (v.elapsed_s == null ? "" : v.elapsed_s + "s")) : "排队";
    return `<div class="prrow">
      <span class="mono dim">0${id} ${esc(row.purpose || "")}</span>
      <div class="bar-track"><div class="bar-fill ${v ? "" : (running ? "run" : "")}"
        style="width:${v ? 100 : 0}%;background:${isModel ? "#EF9F27" : "#1D9E75"}"></div></div>
      <span class="tiny dim" style="text-align:right">${esc(stTxt)}</span></div>`;
  }).join("");

  const hasModel = run.some(id => slotRow(id).calls_model);
  const running_now = running && S.t0;
  return `
  <div class="head"><div class="grow"><h1>第 3 步 · 生成</h1>
    <div class="sub">默认是<b style="font-weight:500">推荐全集</b> —— 系统先摆出最优解，你只做"减"。
      不从空表开始勾。</div></div>
    <button class="btn primary" data-act="run" ${running || !run.length ? "disabled" : ""}>
      ${running ? "生成中…" : (S.state && S.state.counts && S.state.counts.done ? "重新生成" : "开始生成")}</button></div>

  <div class="sgrid">${cards}</div>

  <div class="card pad mt24">
    <div class="row"><div class="grow">
      <h2>本次将生成 ${run.length} 张 · 模型调用 ${hasModel ? 1 : 0} 次 · 预计约 ${hasModel ? 75 : 3} 秒</h2>
      <div class="tiny dim mt8">${hasModel
        ? "七格里只有位置 4 真正调模型。其余全是秒级确定性合成 —— 所以把套装从两张扩到七张，调用费不变。"
        : "本次没有任何坑位需要调模型 —— 全部是确定性合成，几秒钟。"}</div></div>
      ${running_now ? `<div style="text-align:right"><div class="tiny dim">已用</div>
        <div id="elapsed" style="font-size:20px;font-weight:500">0.0 s</div></div>` : ""}
    </div>
    <div class="mt16">${pr || `<div class="tiny dim">没有选中任何坑位。</div>`}</div>
    ${running ? `<div class="note mt16"><b style="font-weight:500">橙色那一条会独自走满全程</b>
      —— 它是唯一没有确定性控制的地方（等云端生成模型）。其余几条一瞬间就完。
      <div class="tiny mt8">进度条只在"这一版已经落盘"时才走到 100%：界面不编造百分比，
        正在跑的那一条是流动条纹而不是估算值。</div></div>` : ""}
    ${S.jobError ? `<div class="note bad mt16">未完成：${esc(S.jobError)}</div>` : ""}
    ${S.lines.length ? `<div class="mt16"><div class="tiny dim">最近进度（原文来自执行回调）</div>
      ${S.lines.slice(-6).map(l => `<div class="logline">${esc(l)}</div>`).join("")}</div>` : ""}
  </div>`;
}

/* ================================================================ 第 4 步 · 审核台 */
function v4(){
  if (!S.state){
    return `<div class="head"><div class="grow"><h1>第 4 步 · 审核台</h1>
      <div class="sub">这一轮还没有产出。</div></div></div>
      <div class="note">回到第 3 步点"开始生成"；或者在第 1 步换一个跑过的商品包 ——
        <b style="font-weight:500">CLI 跑完，审核台打开就能审</b>，两者共用同一份
        <span class="mono">plan.json</span> / <span class="mono">run.jsonl</span>。</div>`;
  }
  const st = S.state, c = st.counts || {};
  const done = doneSlots();
  const cards = done.map(s => slotCard(s)).join("");
  const pend = (st.slots || []).filter(s => s.status !== "done").map(s => {
    const row = slotRow(s.slot_id);
    const why = s.status === "skipped"
      ? "跳过 · 缺 " + (s.missing || []).map(KIND_OF).join("、") : "这一轮未做";
    return `<div class="scard pend">
      <div class="shd"><span class="no">0${s.slot_id}</span>
        <span class="nm">${esc(s.purpose || "")}</span><span class="grow"></span>
        <span class="sw lock"><i></i></span></div>
      <div class="thumb"><div class="ph">${esc(why)}</div>
        <span class="cap">${s.status === "skipped" ? "缺料跳过" : "未做"}</span></div>
      <div class="sft"><span class="tiny dim">${esc(row.renderer_label || s.renderer || "")}</span></div>
    </div>`;
  }).join("");

  const allAcc = c.done > 0 && c.accepted === c.done;
  return `
  <div class="head"><div class="grow"><h1>第 4 步 · 审核台</h1>
    <div class="sub">一屏看完 —— 成套是否同源，只有并排才判断得出来。
      键盘：<span class="kbd">1</span>–<span class="kbd">7</span> 定位 ·
      <span class="kbd">A</span> 采纳当前 · <span class="kbd">R</span> 重做当前 ·
      <span class="kbd">Enter</span> 全组确认（全采纳后）</div></div>
    <div class="row">
      <button class="btn" data-act="allaccept" ${allAcc || !c.done ? "disabled" : ""}>全部采纳</button>
      <button class="btn primary" data-act="export" ${allAcc ? "" : "disabled"}>
        ${allAcc ? "导出交付" : "还差 " + (c.done - c.accepted) + " 张未采纳"}</button>
    </div></div>

  ${st.attest_missing && st.attest_missing.length ? `<div class="note warn mt16">
    这一轮的合规签字还差：<span class="mono">${esc(st.attest_missing.join("、"))}</span>
    —— 补签后需要整批重跑（签字是运行期门禁，不是审核台的开关）。</div>` : ""}

  <div class="card pad mt16">
    <div class="row"><h2>内容计划 · ${done.length} 张各讲什么</h2><span class="grow"></span>
      <span class="tiny dim">只读：改文案改的是商品包，改完用"文案不对"重排文字层（秒级免费）</span></div>
    <div class="mt12 row">${done.map(s =>
      `<span class="pill ${S.focus === s.slot_id ? "on" : ""}" data-act="focus" data-id="${s.slot_id}">
        0${s.slot_id} ${esc(s.purpose || "")}${s.accepted ? " ✓" : ""}</span>`).join(" ")}</div>
    <div class="mt12" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px">
      ${done.map(s => `<div class="tiny dim" style="border-left:2px solid #EDEBE4;padding-left:8px">
        <span class="mono">0${s.slot_id}</span> ${esc(s.purpose || "")}<br>
        ${(s.callouts || []).length
          ? (s.callouts || []).slice(0, 4).map(x => "· " + esc(x)).join("<br>")
          : "<i>这一格不出文字</i>"}</div>`).join("")}
    </div>
  </div>

  <div class="sgrid mt16">${cards}${pend}</div>

  <div class="note mt16">
    <b style="font-weight:500">重做粒度跟着"层"走</b>：文案错 → 秒级免费；位置错 → 秒级免费；
    背景错 → 约 70 秒计费。<b style="font-weight:500">强制三选一，等于零成本的归因数据</b>
    —— 选择会写进 <span class="mono">run.jsonl</span>。
    ${st.log_bad_lines ? `<div class="tiny mt8" style="color:#791F1F">
      ⚠ 日志里有 ${st.log_bad_lines} 行读不出来 —— 它可能正在被写。看下面的"展开 run.jsonl"。</div>` : ""}
  </div>`;
}

/* ================================================================ 第 5 步 · 控制面 */
function v5(){
  if (!S.table) return "";
  const t = S.table;
  const rows = t.slots.map(s => `<tr>
    <td class="mono dim">0${s.slot_id}</td><td class="small">${esc(s.purpose || "")}</td>
    <td><span class="tag">${esc(s.renderer)}</span></td>
    <td class="tiny dim">${esc(s.renderer_label || "")}</td>
    <td>${(s.needs || []).map(k => chip(KIND_OF(k))).join(" ")}</td>
    <td>${s.calls_model ? chip("调模型", "amber") : chip("零调用", "")}</td>
    <td>${s.mandatory ? chip("必选", "teal") : chip("可关", "")}</td>
    <td class="dim tiny">${esc(BG_OF(s.background))}</td>
    <td class="dim tiny">${esc(s.validate_level || "")}</td>
    <td class="dim tiny">${esc((s.cuts || []).map(KIND_OF).join("、") || "—")}</td></tr>`).join("");
  const pal = t.palette || {}, rnd = t.renderers || {};
  const modelRnd = Object.entries(rnd).filter(([,v]) => v.calls_model).map(([k]) => k);
  return `
  <div class="head"><div class="grow"><h1>第 5 步 · 控制面</h1>
    <div class="sub">这张表是唯一数据源。改它，上面三步全部跟着变 ——
      因为"要几张"是算出来的，不是写死的。</div></div></div>

  <div class="note"><b style="font-weight:500">这里是只读的。</b>
    改表的入口是 <span class="mono">config/slots.yaml</span> 与
    <span class="mono">config/catalog/${esc(t.category)}.yaml</span>（改完刷新即生效）。
    刻意<b style="font-weight:500">不</b>做界面写入：表有启动校验与五道守卫在管，
    再加一条绕过它们的写入路径，就会长出"两个地方都能改、但只有一个地方会校验"的漂移。</div>

  <div class="card mt16" style="overflow:hidden">
    <table><thead><tr>
      <th style="width:40px">#</th><th style="width:108px">用途</th><th style="width:126px">renderer</th>
      <th style="width:104px">人话</th><th style="width:196px">需要素材</th>
      <th style="width:76px">成本</th><th style="width:62px">可否关</th>
      <th style="width:78px">背景</th><th style="width:66px">校验</th><th>提前抠</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div>

  <div class="mt16" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px">
    <div class="card pad"><div class="seam"><h2>类目色板</h2>
      <div class="tiny dim mt8">随<b style="font-weight:500">类目</b>变（换类目只换
        <span class="mono">catalog/*.yaml</span>）</div>
      <div class="mt12">${Object.entries(pal).map(([k,v]) =>
        `<div class="kv"><span class="k">${esc(k)}</span><span class="v">
          <span class="swatch" style="background:${esc(v)}"></span>
          <span class="mono">${esc(v)}</span></span></div>`).join("") || '<span class="tiny dim">—</span>'}</div></div></div>
    <div class="card pad"><div class="seam amber"><h2>位置 4 的取景池</h2>
      <div class="tiny dim mt8">提示词只描述<b style="font-weight:500">环境</b>；
        渲染器无条件追加"不得出现产品本体"的负向词（不变量 B）</div>
      <div class="mt12">${(t.bg_prompt_hints || []).map(x =>
        `<div class="tiny dim" style="padding:3px 0">· ${esc(x)}</div>`).join("") || '<span class="tiny dim">—</span>'}</div></div></div>
    <div class="card pad"><div class="seam gray"><h2>重做档位</h2>
      <div class="tiny dim mt8">粒度 ↔ 架构三层，不是随手分的档</div>
      <div class="mt12">${Object.entries(t.layers || {}).map(([k,v]) =>
        `<div class="kv"><span class="k mono">${esc(k)}</span><span class="v tiny">${esc(v)}</span></div>`).join("")}</div></div></div>
  </div>

  <div class="card pad mt16">
    <h2>已登记的 renderer（${Object.keys(rnd).length} 个）</h2>
    <div class="tiny dim mt8">按目录扫描 <span class="mono">src/renderers/*.py</span> 加载 ——
      "加一个 renderer"字面意义上就是"加一个文件"。<b style="font-weight:500">只有
      <span class="mono">${esc(modelRnd.join("、") || "（无）")}</span> 会碰调用层。</b></div>
    <div class="mt12">${Object.entries(rnd).map(([k,v]) =>
      `<div class="kv"><span class="k mono">${esc(k)}</span><span class="v small">
        ${esc(v.label)}　<span class="tiny dim">${esc(v.summary)}</span>
        ${v.calls_model ? chip("调模型", "amber") : chip("零调用", "")}</span></div>`).join("")}</div>
  </div>

  <div class="note mt16"><b style="font-weight:500">注意：这里没有"输出 7 张"这个设置项。</b>
    7 是这张表在当前素材下的一个结果。想改张数，改的是表或素材，不是某个数字。</div>`;
}

/* ================================================================ 弹层 */
function renderModal(){
  const root = $("#modal-root");
  let h = "";

  if (S.showLog && S.state){
    h = `<div class="overlay" data-act="closelog"><div class="modal"
      style="width:min(900px,94vw)" onclick="event.stopPropagation()">
      <div class="row"><div class="grow"><b style="font-size:15px;font-weight:500">运行日志 ·
        <span class="mono">${esc(S.state.run_id)}/run.jsonl</span></b>
        <div class="tiny dim" style="margin-top:2px">唯一的权威状态源。审核台的一切数字都是它的派生。</div>
        </div><button class="btn sm" data-act="reloadlog">刷新</button>
        <button class="btn sm" data-act="closelog">关闭</button></div>
      <div class="mt16" id="logbox"><div class="tiny dim">读取中…</div></div></div></div>`;
    root.innerHTML = h;
    loadLog();
    return;
  }

  if (S.detailFor != null && S.state){
    const s = stRow(S.detailFor);
    if (s){
      const row = slotRow(s.slot_id);
      const v = s.latest ? shownVer(s) : null;
      const val = (v && v.validation) || {};
      h = `<div class="overlay" data-act="close"><div class="modal" onclick="event.stopPropagation()">
        <div class="row"><div class="grow">
          <b style="font-size:15px;font-weight:500">0${s.slot_id} ${esc(s.purpose || "")}</b>
          <div class="tiny dim" style="margin-top:2px">${esc(row.renderer_summary || "")}</div></div>
          <button class="btn sm" data-act="close">关闭</button></div>
        <div class="mt16">${thumbHtml(s)}</div>
        <div class="mt16"><div class="tiny dim">像素来源</div><div class="mt8">${srcChips(row)}</div>
          <div class="tiny dim mt8">主体只有一份：${S.state.subject
            ? `<span class="mono">subject.png</span> sha ${esc(String(S.state.subject.sha256).slice(0,12))}…
               （${esc(S.state.subject.mode || "")}${S.state.subject.recomputed ? " · 本轮重抠" : ""}）
               —— 所有读主体的坑位读的是同一份，这是数据约束、不是提示词期望。`
            : "（这一轮不需要主体）"}</div>
          ${Object.keys(S.state.cutouts || {}).length ? `<div class="tiny dim mt8">素材抠图：
            ${Object.entries(S.state.cutouts).map(([k,c]) =>
              `· ${esc(KIND_OF(k))} ${esc(c.mode || "")}`).join("　")}</div>` : ""}</div>
        <div class="mt16"><div class="tiny dim">生成参数与凭据</div>
          <div class="kv"><span class="k">renderer</span><span class="v mono">${esc(s.renderer)}</span></div>
          <div class="kv"><span class="k">背景</span><span class="v">${esc(BG_OF(s.background))}</span></div>
          <div class="kv"><span class="k">模型</span><span class="v">${s.calls_model
            ? (v && v.placeholder ? "（未调用 —— 无 key，占位图）" : "云端生成模型（位置 4 唯一花钱的一格）")
            : "—（确定性，零调用）"}</span></div>
          <div class="kv"><span class="k">耗时</span><span class="v">${v && v.elapsed_s != null ? v.elapsed_s + " 秒" : "—"}
            <span class="tiny dim">（口径 = 渲染调用本身，不含主体抠图与校验）</span></span></div>
          <div class="kv"><span class="k">版本</span><span class="v">第 ${v ? v.seq : "—"} 版　<span class="mono">${esc(v ? v.file : "")}</span></span></div>
          <div class="kv"><span class="k">主体哈希</span><span class="v mono">${esc(String((v && v.subject_sha256) || "").slice(0,16)) || "—"}</span></div>
        </div>
        <div class="mt16"><div class="tiny dim">校验（只能验确定性那部分 · run.jsonl 为证）</div>
          <div class="mt8 row">${val.passed === true ? chip("全部通过", "teal")
            : val.passed === false ? chip("未过：" + ((val.failed || []).join("、")), "red")
            : chip("无记录", "")}
            ${(s.validate_rules || []).map(r => chip(r)).join("")}</div>
          <div class="tiny dim mt8">"抠干净没有 / 有没有道具 / 有没有错字"验不出来 ——
            那是能力边界，所以人工签字是必需品、不是可选项。</div></div>
      </div></div>`;
    }
  }

  if (S.redoFor != null && S.state){
    const s = stRow(S.redoFor);
    if (s){
      const layers = s.layers || [];
      const meta = {
        text:      {t:"文案不对", d:"只重画文字层，背景与主体不动", c:"秒级 · 免费", free:true},
        placement: {t:"位置或大小不对", d:"只调落点与缩放，画布与文字不动", c:"秒级 · 免费", free:true},
        cutout:    {t:"边缘抠得不干净", d:"本地重抠主体与素材，不联网。注意它会作用于所有用到它们的坑位",
                    c:"一次本地抠图 · 免费", free:true},
        bg:        {t:"背景不对", d:"重新生成空背景，主体与文字原样贴回", c:"约 70 秒 · 1 次调用", free:false}
      };
      h = `<div class="overlay" data-act="close"><div class="modal" onclick="event.stopPropagation()">
        <div class="row"><div class="grow">
          <b style="font-size:15px;font-weight:500">重做 0${s.slot_id} ${esc(s.purpose || "")}</b>
          <div class="tiny dim" style="margin-top:2px">哪儿不对？它决定重出哪一层，也决定这次花多少。</div></div>
          <button class="btn sm" data-act="close">取消</button></div>
        <div class="mt12" style="display:flex;flex-direction:column;gap:8px">
          ${layers.map(k => { const m = meta[k]; return `<div class="opt ${m.free ? "" : "hi"}"
            data-act="pick-redo" data-k="${k}" data-id="${s.slot_id}">
            <div class="grow"><div class="ot">${esc(m.t)}</div>
              <div class="od">${esc(m.d)}</div></div>
            <div class="oc ${m.free ? "free" : "cost"}">${esc(m.c)}</div></div>`; }).join("")}
        </div>
        <div class="note mt16">${s.calls_model
          ? "只有位置 4 有第三档（重生成背景）—— 七格里只有它调模型，也只有它可能出现接缝不融。"
          : "位置 0" + s.slot_id + " 是确定性链路，不调用生成模型，所以只有免费档 —— "
            + "它坏了只会是抠图 / 裁切 / 落点的问题。"}
          <div class="tiny mt8">档位是<b style="font-weight:500">这张表算出来的</b>（
            ${esc(layers.join("、")) || "无"}），不是界面写死的。但它只决定"按钮显示不显示"，
            做不做得了仍以后端判定为准。</div></div>
        <div class="note mt16"><div class="small">若 3 张以上都要换背景 →
          <b style="font-weight:500">问题在内容计划或提示词，不在这一张</b></div>
          <div class="tiny dim mt8">背景由同一套提示词与同一份 plan 生成；重做单张只会重复同样的失败。
            这种情况该改商品包或改表之后整体重跑。这次选择会写入运行日志，用于统计采纳率与归因。</div></div>
      </div></div>`;
    }
  }

  root.innerHTML = h;
}

let _logBusy = false;
async function loadLog(){
  if (_logBusy || !S.runId) return;
  _logBusy = true;
  try {
    const j = await api("/api/runs/" + encodeURIComponent(S.runId) + "/log?tail=400");
    const box = $("#logbox");
    if (!box) return;
    const rows = j.lines.map(r => {
      const rest = Object.entries(r).filter(([k]) => k !== "stage")
        .map(([k,v]) => k + "=" + (v && typeof v === "object" ? JSON.stringify(v) : v)).join(" ");
      return `<div class="logline"><b>${esc(r.stage || "?")}</b> ${esc(rest)}</div>`;
    }).join("");
    box.innerHTML = (j.bad_lines || []).length
      ? `<div class="note bad">有 ${j.bad_lines.length} 行读不出来（多半正在被写）：
          <div class="mono tiny mt8">${j.bad_lines.map(esc).join("<br>")}</div></div>${rows}` : rows;
  } catch(e){
    const box = $("#logbox"); if (box) box.innerHTML = `<div class="note bad">${esc(e.message)}</div>`;
  } finally { _logBusy = false; }
}

/* ================================================================ 动作 */
async function doRun(){
  const only = pickedIds();
  if (!only.length) return toast("没有选中任何坑位。");
  try {
    const j = await api("/api/run", {product:S.productPath, only});
    S.runId = j.run_id; S.state = null; S.phase = "running";
    S.lines = []; S.jobError = null; S.t0 = Date.now(); S.viewSeq = {};
    toast("已开始生成 → " + j.run_id + "（位置 4 约需 70 秒）");
    render(); startPoll();
  } catch(e){ toast("无法开始：" + e.message); render(); }
}

const _by = () => (S.plan && S.plan.e0 && S.plan.e0.attest && S.plan.e0.attest.by) || "本地审核台";

async function doAccept(slotId, seq){
  if (!S.runId) return;
  try {
    const s = stRow(slotId);
    const use = seq != null ? seq : (s ? shownSeq(s) : null);
    const j = await api(`/api/runs/${S.runId}/slots/${slotId}/accept`, {seq:use, by:_by()});
    S.state = j.state; render();
  } catch(e){ toast("无法采纳：" + e.message); }
}

async function doRedo(slotId, layer){
  if (!S.runId) return;
  S.redoFor = null; renderModal();
  try {
    await api(`/api/runs/${S.runId}/slots/${slotId}/redo`, {layer});
    toast(`位置 ${slotId} 重做已开始（layer=${layer}）`);
    S.t0 = S.t0 || Date.now();
    render(); startPoll();
  } catch(e){ toast("无法重做：" + e.message); }
}

async function doExport(){
  if (!S.runId) return;
  try {
    const j = await api(`/api/runs/${S.runId}/export`, {});
    toast("已写出交付清单：" + j.manifest + (j.opened_finder ? "（并在文件管理器中打开）" : ""));
    render();
  } catch(e){ toast("无法导出：" + e.message); }
}

async function doAllAccept(){
  const list = doneSlots().filter(s => !s.accepted);
  if (!list.length) return toast("已经全部采纳了。");
  for (const s of list){
    try {
      const j = await api(`/api/runs/${S.runId}/slots/${s.slot_id}/accept`,
                          {seq:s.latest.seq, by:_by()});
      S.state = j.state;
    } catch(e){ toast(`位置 ${s.slot_id} 采纳失败：${e.message}`); break; }
  }
  const c = (S.state && S.state.counts) || {};
  render();
  if (c.done && c.accepted === c.done)
    toast("七张全部已采纳 —— 顶栏已变「可导出」。");
}

/* 图片读不到时**说出来**，不静默留白 */
document.addEventListener("error", e => {
  const img = e.target;
  if (img && img.tagName === "IMG" && img.dataset.imgFallback !== undefined){
    const d = document.createElement("div");
    d.className = "ph";
    d.textContent = "图片读不到：" + img.dataset.imgFallback;
    img.replaceWith(d);
  }
}, true);

/* ================================================================ 渲染与事件 */
function render(){
  if (!S.table) return;
  vBar(); vSteps();
  const v = {1:v1, 2:v2, 3:v3, 4:v4, 5:v5}[S.step] || v1;
  $("#view").innerHTML = v();
  if (!S.showLog) renderModal();     // 日志弹层是独立刷新的，不跟着轮询重建
  vLogBar();
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = Number(el.dataset.id);
  if (a === "step"){ S.step = Number(el.dataset.n); window.scrollTo(0, 0); render(); return; }
  if (a === "close"){ S.detailFor = null; S.redoFor = null; renderModal(); return; }
  if (a === "showlog"){ S.showLog = true; renderModal(); return; }
  if (a === "closelog"){ S.showLog = false; renderModal(); return; }
  if (a === "reloadlog"){ loadLog(); return; }
  if (a === "product"){
    try { await pickProduct(el.dataset.p); toast("已切换到 " + el.dataset.p); }
    catch(err){ toast(err.message); } return;
  }
  if (a === "pick"){ S.only[id] = S.only[id] === false; render(); return; }
  if (a === "focus"){ S.focus = id; if (S.step === 5) S.step = 4; render(); return; }
  if (a === "view"){ S.viewSeq[id] = Number(el.dataset.seq); render(); return; }
  if (a === "detail"){ S.detailFor = id; renderModal(); return; }
  if (a === "redo"){ S.redoFor = id; renderModal(); return; }
  if (a === "pick-redo"){ doRedo(id, el.dataset.k); return; }
  if (a === "accept"){ doAccept(id); return; }
  if (a === "allaccept"){ doAllAccept(); return; }
  if (a === "export"){ doExport(); return; }
  if (a === "run"){ doRun(); return; }
});

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.key === "Escape"){
    S.detailFor = null; S.redoFor = null; S.showLog = false; renderModal(); return;
  }
  if (S.detailFor != null || S.redoFor != null || S.showLog) return;
  if (S.step !== 4) return;                 // 键盘是"连点七张"的效率细节：只在审核台生效
  const ids = doneSlots().map(s => s.slot_id);
  if (/^[1-9]$/.test(e.key)){
    const want = Number(e.key);
    if (ids.includes(want)){
      S.focus = want; render();
      const el = document.querySelector(".scard.focus");
      if (el) el.scrollIntoView({block:"nearest", behavior:"smooth"});
    }
    return;
  }
  const focus = S.focus != null ? S.focus : (ids[0] || null);
  if ((e.key === "a" || e.key === "A") && focus != null){ doAccept(focus); return; }
  if ((e.key === "r" || e.key === "R") && focus != null){ S.redoFor = focus; renderModal(); return; }
  if (e.key === "Enter"){
    const c = (S.state && S.state.counts) || {};
    if (c.done && c.accepted === c.done) doExport();
    else toast("还有 " + ((c.done || 0) - (c.accepted || 0)) + " 张没采纳 —— "
             + "全组确认只在全部已采纳时可用。");
  }
});

/* 运行中每 120ms 更新一次"已用"，它不是业务数据，只是等待期的可见性 */
setInterval(() => {
  const el = document.getElementById("elapsed");
  if (el && S.t0) el.textContent = ((Date.now() - S.t0) / 1000).toFixed(1) + " s";
}, 120);

boot();
</script>
