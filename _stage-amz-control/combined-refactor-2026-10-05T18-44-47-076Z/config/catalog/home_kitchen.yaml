# ============================================================
# 类目模板 · 家居厨具（home_kitchen）
# ------------------------------------------------------------
# 定位：骨架不变、**换类目只换这个文件**。
#   结构（有几个坑位、各干什么）在 config/slots.yaml；
#   参数（什么色、什么场景基调）在这里。
#
# 字段契约（每个字段必须写明消费它的代码位置，写不出就不许进表）：
#   palette.base    → renderers/flat_overlay（位置 2/3/6/7 的纯色底）
#   palette.text    → textlayer.overlay_callouts（文字色）
#   palette.accent  → textlayer.overlay_callouts（项目符号）+ flat_overlay（标注线箭头）
#   validate_level_default → src/schema.py（坑位未声明强度时的默认值）
#   bg_prompt_hints → M4 gen_bg_paste（位置 4 生成背景的取景提示）
#
# ★ 色板是**类目**的事：换类目只换本文件，底色与强调色随之变；
#   字体与文字条是**品牌**的事，在 config/brand.json。
#   两边曾经各存一份同值的文字色与强调色 —— 靠"恰好同色"掩盖着的双所有者，已收敛。
#
# 刻意不放进来的东西：
#   · 禁用词表 —— 只有一份，在 config/brand.json（planner.extract_facts 消费）。
#     两处各存一份就是漂移的起点，本项目已经因为重复维护踩过一次。
# ============================================================
version: 1
category: home_kitchen
label: 家居厨具

# ------------------------------------------------------------
# 色板：位置 2/3/6/7 的纯色底与文字层共用这一份
#   ——「成套一致」不靠多调模型，靠六张共用一个色系。
# ------------------------------------------------------------
palette:
  base: "#F2F2F2"      # 中性浅灰：与不锈钢/深色杯身的反差足够，且不喧宾夺主
  text: "#1A1A1A"
  accent: "#C8102E"    # 强调色：标注线 / 项目符号 / 数字
  # ★ 位置 4 生成图的主色**不**回写这里。曾经打算这么做（"一次调用的产物被六路复用"），
  #   实测后放弃了，理由是它会引入一条不该有的依赖：
  #     ① 位置 2/3/6/7 的配色将取决于位置 4 是否出图、出得好不好 ——
  #        七个坑位就不再是"同源兄弟"，而是"四张图等一张图"；
  #     ② 重做位置 4 会**静默改变**其余四张的配色，而那四张的产物文件没变 ——
  #        "哪一版更好"的归因数据当场被污染；
  #     ③ 抽查"位置 2 为什么是这个色"要跨到位置 4 的日志里去找。
  #   成套一致性继续由**共享数据**（就这一份 palette）保证，不靠调用结果回溯。

validate_level_default: medium

# ------------------------------------------------------------
# 位置 4（场景图）生成背景的取景提示
#   铁律：**只描述环境，绝不出现产品本体**（不变量 B）。
#   渲染器会在这些文字之外**无条件追加**产品排除负向词，不依赖这里写全。
#
#   两条硬约束（改这个池子时必须守住）：
#   ① 不能出现 brand.forbidden_on_image 里的词 —— 渲染器会**弃用**命中它的提示
#      （一句"促销标签"等于主动邀请模型画那个东西），全池命中则直接报错。
#   ② 必须描述**中央空置**的构图。主体是居中贴入的（几何规则在 src/placement.py，
#      位置 4 不搞特例），所以提示词说"右侧留白"会让那块空白孤零零地空在主体旁边
#      —— 那不是留白，那是构图偏了。
# ------------------------------------------------------------
bg_prompt_hints:
  - "明亮的家居餐桌场景，晨光从左侧窗户照进来，浅色木质桌面中央大面积空置"
  - "简洁的办公室桌面一角，浅灰墙面，柔和自然光，画面中央干净无物"
  - "厨房台面近景，浅木色台面，背景虚化，画面中央留出空处"
