<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品套图工作台 · 第三版设计走查原型（离线演示）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#F6F7F9;color:#101828;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%}
/* ---------- 演示控制条（产品界面之外） ---------- */
.demobar{display:flex;align-items:center;gap:14px;padding:7px 18px;background:#111827;color:#9CA3AF;font-size:12px;flex-wrap:wrap}
.demobar .dtag{color:#F9FAFB;font-weight:600;letter-spacing:.02em}
.demobar .dgroup{display:flex;align-items:center;gap:6px}
.demobar .spacer{flex:1}
.demobar button{font:inherit;color:#D1D5DB;background:transparent;border:1px solid #374151;border-radius:6px;padding:2px 10px;cursor:pointer}
.demobar button:hover{border-color:#6B7280;color:#fff}
.demobar button.on{background:#2457D6;border-color:#2457D6;color:#fff}
/* ---------- 应用壳 ---------- */
.app{max-width:1240px;margin:0 auto;padding:0 24px 120px}
.taskbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:12px 2px;background:#F6F7F9;border-bottom:1px solid #E4E7EC}
.tb-id{display:flex;gap:10px;align-items:center;min-width:210px}
.tb-thumb{width:38px;height:38px;border-radius:9px;background:#fff;border:1px solid #E4E7EC;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.tb-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.tb-thumb .ph-mini{font-size:10px;color:#98A2B3}
.tb-name{font-weight:600;line-height:1.25}
.tb-sub{font-size:12px;color:#667085;line-height:1.3}
.stages{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:nowrap;overflow-x:auto}
.stg{display:block;border:1px solid transparent;background:transparent;border-radius:9px;padding:4px 10px;font:inherit;text-align:left;color:#98A2B3;cursor:default;flex:none}
.stg small{display:block;font-size:11px;color:#98A2B3;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg b{font-size:13px;font-weight:600;color:inherit}
.stg.done{color:#344054;cursor:pointer}
.stg.done:hover{background:#fff;border-color:#E4E7EC}
.stg.done b{color:#18794E}
.stg.cur{background:#EEF2FF;border-color:#C7D2FE;color:#2457D6}
.stg.cur small{color:#4F5BD5}
.tb-right{display:flex;align-items:center;gap:10px;flex:none}
/* ---------- 通用组件 ---------- */
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid #D0D5DD;background:#fff;color:#344054;border-radius:8px;padding:7px 14px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:#98A2B3}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #2457D6;outline-offset:2px}
.btn-primary{background:#2457D6;border-color:#2457D6;color:#fff}
.btn-primary:hover{background:#1D4FC4;border-color:#1D4FC4}
.btn-ghost{border-color:transparent;background:transparent;color:#2457D6;padding-left:8px;padding-right:8px}
.btn-ghost:hover{background:#EEF2FF}
.btn-sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary[disabled]:hover{background:#2457D6;border-color:#2457D6}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip-ok{background:#E7F6EC;color:#18794E}
.chip-warn{background:#FEF0C7;color:#B54708}
.chip-err{background:#FEE4E2;color:#B42318}
.chip-info{background:#EEF2FF;color:#3538CD}
.chip-muted{background:#F2F4F7;color:#475467}
.card{background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:18px 20px}
.card+.card{margin-top:14px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.h-title{font-size:16px;font-weight:600}
.h-sub{font-size:12px;color:#667085;margin-top:2px}
.muted{color:#667085}
.small{font-size:12px}
.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid #EAECF0}
.actions .right{display:flex;gap:10px;align-items:center}
.actions .left{display:flex;gap:10px;align-items:center}
input[type=text],input[type=url],input[type=number],select,textarea{font:inherit;font-size:13px;padding:8px 10px;border:1px solid #D0D5DD;border-radius:8px;background:#fff;color:#101828;width:100%}
textarea{min-height:74px;resize:vertical}
.field label{font-size:12px;color:#475467;display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.notice{font-size:13px;border-radius:10px;padding:10px 14px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.notice-info{background:#EEF2FF;color:#3538CD}
.notice-warn{background:#FFFAEB;color:#B54708}
.notice-err{background:#FEF3F2;color:#B42318}
.notice-ok{background:#ECFDF3;color:#18794E}
hr.sep{border:none;border-top:1px solid #EAECF0;margin:16px 0}
</style>
<style>
/* ---------- 资料接入 ---------- */
.sheet{max-width:940px;margin:26px auto 0}
.refgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ref{border:1px solid #E4E7EC;border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.ref img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#F2F4F7}
.ref .rmeta{padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.ref .rmeta .rrow{display:flex;gap:4px}
.ref .rmeta button{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid #E4E7EC;background:#fff;color:#475467;cursor:pointer}
.reffill{border:1.5px dashed #D0D5DD;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;color:#667085;font-size:12px;cursor:pointer}
.reffill:hover{border-color:#98A2B3;color:#344054}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.points li{display:flex;gap:8px;align-items:center}
.points .dot{width:6px;height:6px;border-radius:50%;background:#98A2B3;flex:none}
.points input{flex:1}
.checkline{display:flex;gap:8px;align-items:center;font-size:12px;color:#475467;background:#F9FAFB;border:1px dashed #E4E7EC;border-radius:8px;padding:9px 12px}
.menu{position:relative;display:inline-block}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;left:0;bottom:calc(100% + 8px);z-index:30;background:#fff;border:1px solid #E4E7EC;border-radius:10px;box-shadow:0 12px 24px rgba(16,24,40,.12);padding:6px;min-width:250px}
.menu-pop button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;background:none;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:#344054}
.menu-pop button:hover{background:#F2F4F7}
.menu-pop small{display:block;color:#66798A;color:#667085;font-size:11px;margin-top:2px}
/* ---------- 商品理解 ---------- */
.briefgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.sect{border:1px solid #E4E7EC;border-radius:12px;background:#fff;padding:14px 16px}
.sect h3{margin:0 0 6px;font-size:13px;font-weight:600;color:#344054}
.sect .src{font-size:11px;color:#98A2B3}
.sect p{margin:0;font-size:13px;color:#101828;white-space:pre-wrap}
.sect textarea{min-height:88px;margin-top:4px}
.sect+.sect{margin-top:12px}
.sidecol>.sect+.sect{margin-top:12px}
/* ---------- 方案 ---------- */
.stylebar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:12px 16px}
.stylebar .kw{display:flex;flex-direction:column;gap:2px}
.stylebar .kw b{font-size:12px;color:#667085;font-weight:500}
.stylebar .kw span{font-size:13px}
.stylebar .grow{flex:1}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.shot{background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.shot .shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shot .shead b{font-size:14px}
.shot .srow{display:flex;gap:12px}
.shot .srow img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #E4E7EC;background:#F2F4F7;flex:none}
.shot .srow .txt{font-size:12px;color:#475467;display:flex;flex-direction:column;gap:4px}
.shot .srow .txt b{color:#344054;font-weight:600}
.shotfoot{display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid #F2F4F7}
.shotfoot .grow{flex:1}
.shotadd{border:1.5px dashed #D0D5DD;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;min-height:180px;color:#667085;font-size:13px;cursor:pointer}
.shotadd:hover{border-color:#98A2B3;color:#344054}
details.peek{border-top:1px solid #F2F4F7;padding-top:8px}
details.peek summary{font-size:12px;color:#2457D6;cursor:pointer}
.blocks{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.blocks .blk{border:1px solid #EAECF0;border-radius:8px;padding:8px 10px;background:#FCFCFD}
.blocks .blk b{display:block;font-size:11px;color:#667085;font-weight:600;margin-bottom:2px}
.blocks .blk span{font-size:12px;color:#344054;display:block;white-space:pre-wrap}
/* ---------- 生成中 ---------- */
.gentiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.gt{background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.gt .ghead{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:600}
.gimg{aspect-ratio:1/1;border-radius:10px;background:#F2F4F7;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-direction:column;gap:8px;color:#667085;font-size:12px;border:1px solid #F2F4F7}
.gimg img{width:100%;height:100%;object-fit:cover}
.spin{width:18px;height:18px;border:2px solid #C7D2FE;border-top-color:#2457D6;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gfoot{display:flex;gap:8px;align-items:center}
/* ---------- 审核 ---------- */
.review{display:grid;grid-template-columns:118px minmax(0,1fr) 330px;gap:16px;margin-top:18px;align-items:start}
.rail{display:flex;flex-direction:column;gap:10px}
.railbtn{display:block;width:100%;border:1px solid #E4E7EC;background:#fff;border-radius:10px;padding:6px;cursor:pointer;text-align:left;font:inherit;color:#344054}
.railbtn img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;display:block;background:#F2F4F7}
.railbtn .rname{font-size:12px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.railbtn .rstate{font-size:11px;color:#667085}
.railbtn.cur{border-color:#2457D6;box-shadow:0 0 0 3px #EEF2FF}
.bigwrap{background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:12px}
.bigimg{width:100%;aspect-ratio:1/1;max-height:58vh;object-fit:contain;background:#F2F4F7;border-radius:10px;display:block}
.cands{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.candbtn{position:relative;border:2px solid transparent;border-radius:9px;padding:0;background:none;cursor:pointer;line-height:0}
.candbtn img{width:64px;height:64px;object-fit:cover;border-radius:7px;display:block;background:#F2F4F7}
.candbtn.cur{border-color:#2457D6}
.candbtn .nn{position:absolute;top:-7px;right:-7px;background:#6941C6;color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;line-height:1.5}
.meta-line{font-size:12px;color:#667085;margin-top:10px}
.side{display:flex;flex-direction:column;gap:12px}
.sidecard{background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:14px}
.sidecard h3{margin:0 0 8px;font-size:13px;font-weight:600;color:#344054}
.sidebtns{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:#475467;background:#F9FAFB;border-radius:8px;padding:9px 11px;line-height:1.5}
.note-warn{background:#FFFAEB;color:#B54708}
.note-err{background:#FEF3F2;color:#B42318}
.note-ok{background:#ECFDF3;color:#18794E}
.phcard{aspect-ratio:1/1;width:100%;border:1.5px dashed #A4BCFD;border-radius:10px;background:#F5F8FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#3538CD;font-size:12px;text-align:center;padding:18px;line-height:1.6}
.phcard b{font-size:13px}
/* ---------- 交付 ---------- */
.delivgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.dcard{background:#fff;border:1px solid #E4E7EC;border-radius:12px;overflow:hidden}
.dcard img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#F2F4F7}
.dcard .dmeta{padding:10px 12px;font-size:12px;color:#475467;display:flex;flex-direction:column;gap:4px}
.dcard .dmeta b{color:#101828;font-size:13px}
.filelist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.filelist li{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#F9FAFB;border:1px solid #EAECF0;border-radius:8px}
.filelist .fname{font-weight:600;color:#344054}
/* ---------- 对话框与提示 ---------- */
dialog{border:none;border-radius:14px;padding:0;max-width:780px;width:calc(100vw - 40px);box-shadow:0 24px 48px rgba(16,24,40,.2)}
dialog::backdrop{background:rgba(16,24,40,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid #EAECF0}
.dlg-head b{font-size:15px}
.dlg-body{padding:16px 20px;max-height:66vh;overflow:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #EAECF0}
.causes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.causes label{display:flex;gap:10px;align-items:flex-start;border:1px solid #E4E7EC;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px}
.causes label:hover{border-color:#98A2B3}
.causes input{margin-top:3px}
.causes label.on{border-color:#2457D6;background:#F5F8FF}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:#101828;color:#F9FAFB;font-size:13px;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:90;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- 响应式 ---------- */
@media (max-width:1080px){.briefgrid{grid-template-columns:1fr}.review{grid-template-columns:104px minmax(0,1fr)}.review .side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.review .side .sidecard{flex:1;min-width:260px}}
@media (max-width:1023px){.review{grid-template-columns:1fr}.rail{flex-direction:row;overflow-x:auto;padding-bottom:4px}.railbtn{min-width:92px;flex:none}.stages{justify-content:flex-start}}
@media (max-width:900px){.shots{grid-template-columns:1fr}.gentiles{grid-template-columns:1fr 1fr}.delivgrid{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.app{padding:0 14px 90px}.grid2,.grid3{grid-template-columns:1fr}.refgrid{grid-template-columns:1fr 1fr}.gentiles,.delivgrid{grid-template-columns:1fr}.taskbar{flex-wrap:wrap;gap:8px}.stages{order:3;width:100%}.tb-id{min-width:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="demobar" role="region" aria-label="演示控制（非产品界面）">
  <span class="dtag">演示控制 · 非产品界面</span>
  <div class="dgroup">情形注入（下次运行时生效）：
    <button type="button" data-scn="normal" class="on">正常</button>
    <button type="button" data-scn="partial">局部失败</button>
    <button type="button" data-scn="unknown">结果未知</button>
  </div>
  <span class="spacer"></span>
  <span id="demoHint">离线演示：不调用模型、不写文件；候选与提示词来自本地示例产物</span>
  <button type="button" id="demoReset">复位到新建</button>
</div>

<div class="app">
  <header class="taskbar">
    <div class="tb-id">
      <div class="tb-thumb" id="tbThumb"><span class="ph-mini">新任务</span></div>
      <div>
        <div class="tb-name" id="tbName">新建商品套图任务</div>
        <div class="tb-sub" id="tbSub">离线演示环境 · Amazon US</div>
      </div>
    </div>
    <nav class="stages" id="stages" aria-label="任务阶段"></nav>
    <div class="tb-right">
      <span class="chip chip-muted" id="envBadge">离线演示</span>
    </div>
  </header>
  <main id="main"></main>
</div>

<dialog id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
var timers = [];
function later(fn, ms){ var t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ for(var i=0;i<timers.length;i++){ clearTimeout(timers[i]); } timers = []; }

/* =====================================================================
   示例夹具（虚构商品，仅用于离线演示）
   data → 理解/方案/提示词都从这些字段派生，机制代码里不出现商品常量
   ===================================================================== */
var FIX = {};

FIX.aster = {
  id:"aster",
  name:"Aster 01 保温杯",
  sku:"demo-tumbler-aster-01",
  category:"保温杯（随行杯）",
  platform:"Amazon US",
  thumb:"../fixture-design/pack/01-front-full.png",
  points:[
    "哑光直筒杯身，上段为均匀深青绿色，无渐变、无图案",
    "杯盖为两层同心阶梯环，杯口与杯身之间有一圈窄陶土橙饰环",
    "下部约三成为深炭灰防滑套，带三条水平筋"
  ],
  refs:[
    {role:"正面全身", img:"../fixture-design/pack/01-front-full.png"},
    {role:"杯口细节", img:"../fixture-design/pack/02-upper-closeup.png"},
    {role:"下部细节", img:"../fixture-design/pack/03-lower-detail.png"}
  ],
  brief:[
    {k:"商品身份", src:"来自参考图", v:"单个高直筒杯体 + 旋拧杯盖；高宽视觉比例约 3.1 : 1，侧壁近乎平直；无把手、无侧握、无吸管。"},
    {k:"颜色与分色", src:"来自参考图", v:"上段约 72% 为哑光深青绿（约 #0F6B66），无渐变、无图案；下段约 28% 为深炭灰防滑套（约 #252A2A），带三条水平筋；杯盖为低矮深炭灰，顶部可见两层同心阶梯；杯盖与杯体之间一圈窄陶土橙饰环（约 #D97A45）。"},
    {k:"表面规则", src:"来自参考图", v:"外表面完全空白：无文字、数字、字母、Logo、标签、贴纸、水印与装饰符号。"},
    {k:"Unknown", src:"资料未声明", v:"材质（未声明）\n容量（未声明，画面不得出现容量字样）\n保温性能（未声明，且不属于图片可验证范围）"},
    {k:"可变化范围", src:"事实锁白名单", v:"场景、光线、构图、镜头角度、背景材质可以变化；商品身份、颜色分色、结构件与表面规则是事实锁，不可变化。"},
    {k:"平台约束", src:"平台规则", v:"Amazon US：主图使用纯白背景、无文字、无道具、1:1；任何一张都不得出现第二件同类商品。"}
  ],

function summaryOf(stage){
  var t = [];
  if(stage==="intake"){
    if(S.intake.refs.length) t.push(S.intake.refs.length+" 张参考图");
    if(S.intake.points.length) t.push(S.intake.points.length+" 条卖点");
  }
  if(stage==="brief" && S.brief){ t.push(S.brief.length+" 项已确认"); }
  if(stage==="plan" && S.shots){ t.push(S.shots.length+" 张方案"); }
  if(stage==="generating"){
    var r=0, bad=0; for(var k in S.genState){ if(S.genState[k]==="ready") r++; if(S.genState[k]==="failed"||S.genState[k]==="unknown") bad++; }
    t.push(r+" 张就绪"); if(bad) t.push(bad+" 张待处理");
  }
  if(stage==="review" && S.shots){ t.push("已采用 "+adoptedCount()+" / "+S.shots.length); }
  if(stage==="delivery"){ t.push(S.shots ? (adoptedCount()+" 张已选") : ""); }
  return t.filter(Boolean).join(" · ");
}

/* ---------------- 生成中 ---------------- */
function hasCands(id){ return allCands(id).length > 0; }
function gTile(shot){
  var st = S.genState[shot.id] || "queued";
  var body = "", foot = "";
  if(st==="queued"){ body = '<div class="gimg"><span class="chip chip-muted">排队中</span></div>'; }
  else if(st==="running"){ body = '<div class="gimg"><div class="spin" role="presentation"></div><span>生成中</span></div>'; }
  else if(st==="ready"){ var c = allCands(shot.id)[0]; body = '<div class="gimg"><img src="'+esc(c?c.img:"")+'" alt="'+esc(shot.purpose)+'候选缩略图"></div>'; foot = '<div class="gfoot"><button type="button" class="btn btn-sm" data-act="openCand" data-id="'+shot.id+'">查看</button><span class="small muted">已就绪，可提前打开</span></div>'; }
  else if(st==="failed"){ body = '<div class="gimg"><span class="chip chip-err">失败</span><span style="padding:0 10px;text-align:center">'+esc(S.genReason[shot.id]||"生成失败")+'</span></div>'; foot = '<div class="gfoot"><button type="button" class="btn btn-sm" data-act="retryShot" data-id="'+shot.id+'">重试此张</button></div>'; }
  else if(st==="unknown"){ body = '<div class="gimg"><span class="chip chip-warn">结果未知</span><span style="padding:0 10px;text-align:center">'+esc(S.genReason[shot.id]||"请求超时")+'</span></div>'; foot = '<div class="gfoot"><button type="button" class="btn btn-sm" data-act="verifyShot" data-id="'+shot.id+'">查证</button><span class="small muted">先查证，再决定重试</span></div>'; }
  else if(st==="verifying"){ body = '<div class="gimg"><div class="spin" role="presentation"></div><span>查证中…</span></div>'; }
  else if(st==="nocand"){ body = '<div class="gimg"><span class="chip chip-muted">无演示候选</span><span style="padding:0 10px;text-align:center">离线演示没有为该张准备候选；正式版本会调用模型生成</span></div>'; }
  return '<div class="gt"><div class="ghead"><span>'+esc(shot.purpose)+'</span><span class="small muted">S'+ (shotIndex(shot.id)+1) +'</span></div>'+body+foot+'</div>';
}
function viewGenerating(){
  var tiles = "";
  var ready=0, done=0, bad=0, running=0;
  for(var i=0;i<S.shots.length;i++){
    var st = S.genState[S.shots[i].id] || "queued";
    if(st==="ready"||st==="nocand"){ ready++; done++; } 
    if(st==="ready"||st==="nocand"||st==="failed"||st==="unknown") done++;
    if(st==="failed"||st==="unknown") bad++;
    if(st==="running"||st==="verifying") running++;
    tiles += gTile(S.shots[i]);
  }
  var left = "";
  if(ready>0){
    left = '<button type="button" class="btn" data-act="gotoReview">'+(bad ? ("先审核已完成的 "+ready+" 张") : ("继续审核（"+ready+" 张已就绪）"))+'</button>';
  }
  return '<div class="sheet" style="max-width:1040px">' +
    '<div class="card">' +
      '<div class="card-head"><div><div class="h-title">正在生成套图</div><div class="h-sub">逐图状态；已就绪的图可以提前打开。单张失败或未知只影响本张，其余结果保留。</div></div>' +
      '<span class="chip '+(bad?'chip-warn':'chip-info')+'">已完成 '+done+' / '+S.shots.length+'</span></div>' +
      '<div class="gentiles">'+tiles+'</div>' +
      '<div class="actions"><div class="left">'+left+'</div><div class="right">'+
        (running ? '<span class="small muted">生成中…（离散状态，不用百分比）</span>' : (bad ? '<span class="small muted">其余张不受影响</span>' : '<span class="small muted">全部就绪后自动进入审核</span>'))+
      '</div></div>' +
    '</div>' +
  '</div>';
}
function pendingShots(){
  var out = [];
  for(var i=0;i<S.shots.length;i++){
    var id = S.shots[i].id;
    if(S.genState[id]==="ready" && !S.stale[id]) continue;
    out.push(id);
  }
  return out;
}
function readyCount(){
  var n = 0;
  for(var i=0;i<S.shots.length;i++){ if(S.genState[S.shots[i].id]==="ready") n++; }
  return n;
}
function runBatch(){
  S.hasGenerated = true;
  S.stage = "generating";
  var ids = pendingShots();
  for(var q=0;q<ids.length;q++){ S.genState[ids[q]] = "queued"; }
  render();
  if(!ids.length){ finishBatch(); return; }
  var k = 0;
  function step(){
    if(k >= ids.length){ finishBatch(); return; }
    var shotId = ids[k];
    var myK = k;
    S.genState[shotId] = "running"; render();
    later(function(){
      var scn = S.scenario;
      if(scn==="partial" && myK===1){ S.genState[shotId]="failed"; S.genReason[shotId]="模拟情形：生成服务返回超时，可安全重试；其余张不受影响。"; }
      else if(scn==="unknown" && myK===0){ S.genState[shotId]="unknown"; S.genReason[shotId]="模拟情形：请求超过等待时间，结果未知，需要先查证。"; }
      else if(hasCands(shotId)){ S.genState[shotId]="ready"; delete S.stale[shotId]; }
      else { S.genState[shotId]="nocand"; }
      render(); k = myK + 1; step();
    }, 850 + myK*350);
  }
  step();
}
function finishBatch(){
  var pending = 0;
  for(var k in S.genState){ if(S.genState[k]!=="ready" && S.genState[k]!=="nocand") pending++; }
  render();
  if(pending===0){
    later(function(){
      S.stage = "review";
      if(!S.currentShot){ S.currentShot = S.shots[0].id; }
      render();
      toast("套图已就绪：逐张选择或重做");
    }, 650);
  }
}
function updateShot(id){
  S.genState[id] = "running";
  S.stage = "generating";
  render();
  later(function(){
    S.genState[id] = hasCands(id) ? "ready" : "nocand";
    if(S.genState[id]==="ready"){ delete S.stale[id]; }
    render();
    toast("已按新方案更新这一张");
  }, 1200);
}
function retryShot(id){
  S.genState[id] = "running"; render();
  later(function(){
    S.genState[id] = hasCands(id) ? "ready" : "nocand";
    S.genReason[id] = "";
    finishBatch();
  }, 1100);
}
function verifyShot(id){
  S.genState[id] = "verifying"; render();
  later(function(){
    S.genState[id] = "failed";
    S.genReason[id] = "查证结果：服务端确认未生成（无重复计费），可以安全重试。";
    render();
  }, 1000);
}

/* ---------------- 审核与定向返工 ---------------- */
function railState(shot){
  if(S.adopted[shot.id]) return {cls:"chip-ok", txt:"已采用"};
  if(S.reworking && S.reworking[shot.id]) return {cls:"chip-info", txt:"生成中"};
  var st = S.genState[shot.id];
  if(st==="ready") return {cls:"chip-muted", txt:"待审核"};
  if(st==="nocand") return {cls:"chip-muted", txt:"未就绪"};
  if(st==="failed") return {cls:"chip-err", txt:"失败"};
  if(st==="unknown") return {cls:"chip-warn", txt:"未知"};
  return {cls:"chip-muted", txt:"未就绪"};
}
function railHtml(){
  var html = "";
  for(var i=0;i<S.shots.length;i++){
    var s = S.shots[i];
    var arr = allCands(s.id);
    var cid = currentCandId(s.id);
    var c = cid ? findCand(s.id, cid) : null;
    var st = railState(s);
    var img = (c && c.img) ? '<img src="'+esc(c.img)+'" alt="">' : '<div style="width:100%;aspect-ratio:1/1;border-radius:6px;background:#F2F4F7;border:1px dashed #D0D5DD"></div>';

}

function bigImg(cand){

}
function viewReview(){
  if(!S.currentShot || !getShot(S.currentShot)){ S.currentShot = S.shots[0].id; }
  var shot = getShot(S.currentShot);
  var st = S.genState[shot.id];
  var arr = allCands(shot.id);
  var cid = currentCandId(shot.id);
  var cand = cid ? findCand(shot.id, cid) : null;
  var center = "";
  if(st==="ready" || arr.length){
    if(S.reworking && S.reworking[shot.id]){
      center = '<div class="bigwrap"><div class="gimg" style="aspect-ratio:1/1;max-height:58vh"><div class="spin"></div><span>正在按你的方向重做这一张…其他张不受影响</span></div></div>';
    } else if(S.compare && arr.length>1){
      var a = arr[0], b = cand || arr[arr.length-1];
      center = '<div class="bigwrap"><div class="grid2">' +
        '<div><div class="small muted" style="margin-bottom:6px">候选 1（旧版）</div>'+bigImg(a)+'</div>' +
        '<div><div class="small muted" style="margin-bottom:6px">当前候选</div>'+bigImg(b)+'</div>' +
      '</div>' +
      '<div class="meta-line">并排比较：左侧为旧候选，右侧为当前候选；采用其中一个不会删除另一个。</div>' +
      '<div style="margin-top:8px"><button type="button" class="btn btn-sm" data-act="toggleCompare">退出比较</button></div></div>';
    } else {
      center = '<div class="bigwrap">'+bigImg(cand)+
        '<div class="cands">'+candStrip(shot.id)+'<span class="small muted">'+arr.length+' 个候选 · 点击切换</span></div>' +
        '<div class="meta-line">候选 '+(arr.indexOf(cand)+1)+' / '+arr.length+' · 来源：'+esc(cand?cand.src:"")+' · '+esc(cand?cand.date:"")+' · 提示词 v'+(cand&&cand.pv?cand.pv:promptV(shot.id))+
        (cand && cand.isNew ? ' · <span class="chip chip-info">本次返工新增</span>' : '') + '</div>' +
        (arr.length>1 ? '<div style="margin-top:8px"><button type="button" class="btn btn-sm" data-act="toggleCompare">并排比较旧版</button></div>' : '') +
      '</div>';
    }
  } else {

      '<div class="note">已采用 '+adoptedCount()+' / '+S.shots.length+' 张</div>' +
      '<div class="sidebtns" style="margin-top:10px">' +
        '<button type="button" class="btn btn-primary" data-act="gotoDelivery"'+(adoptedCount()===S.shots.length?'':' disabled')+'>进入交付</button>' +
        '<button type="button" class="btn" data-act="navBack" data-val="plan">返回方案调整</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  return '<div class="review">' +
    '<div class="rail">'+railHtml()+'</div>' +
    '<div class="stagecenter">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><div><span class="h-title">S'+(shotIndex(shot.id)+1)+' · '+esc(shot.purpose)+'</span> <span class="small muted">'+esc(shot.direction)+'</span></div></div>' +
      center +

  '</div>';

function saveBrief(){

  for(var i=0;i<tas.length;i++){
    var idx = parseInt(tas[i].getAttribute("data-bs"),10);
    var nv = tas[i].value;
    if(S.brief[idx] && nv !== S.brief[idx].v){
      if(S.brief[idx].k.indexOf("卖点")>=0) changedPoints = true; else changedOther = true;
      S.brief[idx].v = nv;
    }
  }
  S.briefEditing = false;
  var n = 0;
  if(S.hasGenerated && (changedPoints || changedOther)){
    for(var k=0;k<S.shots.length;k++){
      var s = S.shots[k];
      if(changedOther || s.uses.indexOf("points")>=0){ S.stale[s.id] = true; n++; }
    }
  }
  render();
  toast(n ? ("已保存修正：受影响 " + n + " 张标记为需更新") : "已保存修正");
}

function submitRework(id){
  var picked = document.querySelector('input[name="cause"]:checked');
  var reasonId = picked ? picked.value : "shape";
  var c = null; for(var i=0;i<CORRECTIONS.length;i++){ if(CORRECTIONS[i].id===reasonId) c = CORRECTIONS[i]; }
  var note = ($("rwNote") && $("rwNote").value) || "";
  var b = blocksOf(id);
  var nb = {v: promptV(id)+1, lock:b.lock, blank:b.blank, negshape:b.negshape, scene:b.scene, comp:b.comp, style:b.style, negative:b.negative};
  var add = c.text || "";
  if(note) add = (add ? add + " " : "") + note;
  if(!add) add = "Additional requirement: keep the product unchanged and improve the framing.";
  nb[c.block] = nb[c.block] + " " + add;
  S.promptOv[id] = nb;
  delete S.stale[id];
  closeModal();
  S.reworking = S.reworking || {}; S.reworking[id] = true;
  S.compare = false;
  render();
  toast("已提交返工：只重新生成这一张");
  later(function(){
    var f = fx();
    S.poolUse = S.poolUse || {};
    var used = S.poolUse[id] || 0;
    var pool = f.pool[id] || [];
    var item = pool[used] || null;
    S.poolUse[id] = used + 1;
    S.extraCands[id] = S.extraCands[id] || [];
    var newId = id + "-r" + (used+1);
    if(item){
      S.extraCands[id].push({id:newId, img:item.img, src:item.src + " · 按新提示词重跑（v"+nb.v+"）", date:"2026-09-28", pv:nb.v, isNew:true});
    } else {
      S.extraCands[id].push({id:newId, img:null, src:"模拟返工候选（离线演示：本张无对应素材）", date:"2026-09-28", pv:nb.v, isNew:true});
    }
    S.reworking[id] = false;
    S.currentCand[id] = newId;
    render();
    toast("返工完成：只新增这张的候选，其他张版本不变");
  }, 1500);
}
function adopt(id){

    var sid = S.shots[i].id;
    if(!S.adopted[sid] && S.genState[sid]==="ready"){ S.currentShot = sid; break; }
  }
  render();
  if(adoptedCount()===S.shots.length){ toast("全部已采用：可以进入交付"); }
}

  S.shots = null; S.genState = {}; S.genReason = {}; S.hasGenerated = false;
  S.promptOv = {}; S.promptDirty = {}; S.stale = {}; S.adopted = {};
  S.currentShot = null; S.currentCand = {}; S.extraCands = {}; S.poolUse = {};
  S.compare = false; S.exported = false; S.reworking = {};
  render();
  toast("已复位：空白任务（未加载任何商品）");
}
function handle(act, id, val, idx){
  if(act==="load"){ loadFixture(val); return; }
  if(act==="addRef"){ pickFile(-1); return; }
  if(act==="repRef"){ pickFile(idx); return; }
  if(act==="rmRef"){ S.intake.refs.splice(idx,1); render(); return; }
  if(act==="addPoint"){ S.intake.points.push(""); render(); return; }
  if(act==="rmPoint"){ S.intake.points.splice(idx,1); render(); return; }
  if(act==="analyze"){ analyze(); return; }
  if(act==="navBack"){ nav(val); return; }
  if(act==="editBrief"){ S.briefEditing = true; render(); return; }
  if(act==="cancelBrief"){ S.briefEditing = false; S.brief = buildBrief(); render(); return; }
  if(act==="saveBrief"){ saveBrief(); return; }
  if(act==="confirmBrief"){ confirmBrief(); return; }
  if(act==="styleEdit"){ openStyle(); return; }
  if(act==="saveStyle"){ saveStyle(); return; }
  if(act==="shotAdj"){ openShotAdj(id); return; }
  if(act==="saveShotAdj"){ saveShotAdj(id); return; }
  if(act==="shotAdd"){ shotAdd(); return; }
  if(act==="shotDel"){ shotDel(id); return; }
  if(act==="generate"){ runBatch(); return; }
  if(act==="retryShot"){ retryShot(id); return; }
  if(act==="updateShot"){ updateShot(id); return; }
  if(act==="verifyShot"){ verifyShot(id); return; }
  if(act==="openCand"){ S.currentShot = id; S.stage = "review"; render(); return; }
  if(act==="gotoReview"){ S.stage = "review"; if(!S.currentShot) S.currentShot = S.shots[0].id; render(); return; }
  if(act==="pickShot"){ S.currentShot = id; S.compare = false; render(); return; }
  if(act==="pickCand"){ S.currentCand[id] = val; render(); return; }
  if(act==="adopt"){ adopt(id); return; }
  if(act==="rework"){ openRework(id); return; }
  if(act==="submitRework"){ submitRework(id); return; }
  if(act==="toggleCompare"){ S.compare = !S.compare; render(); return; }
  if(act==="openPrompt"){ openPrompt(id); return; }
  if(act==="savePrompt"){ savePrompt(id); return; }
  if(act==="resetPrompt"){ resetPrompt(id); return; }
  if(act==="gotoDelivery"){ S.stage = "delivery"; render(); return; }
  if(act==="backToGen"){ nav("generating"); return; }
  if(act==="export"){ openExport(); return; }
  if(act==="newTask"){ resetAll(); return; }
  if(act==="closeModal"){ closeModal(); return; }
}
document.addEventListener("click", function(ev){
  var t = ev.target;
  while(t && t !== document && !(t.getAttribute && (t.getAttribute("data-act")||t.getAttribute("data-nav")||t.getAttribute("data-scn")||t.id==="demoReset"))){ t = t.parentNode; }
  if(!t || t === document) return;
  if(t.id === "demoReset"){ resetAll(); return; }
  if(t.getAttribute("data-nav")){ nav(t.getAttribute("data-nav")); return; }
  if(t.getAttribute("data-scn")){ setScenario(t.getAttribute("data-scn")); return; }
  var act = t.getAttribute("data-act");
  var id = t.getAttribute("data-id") || "";
  var val = t.getAttribute("data-val") || "";
  var idx = parseInt(t.getAttribute("data-i") || "-1", 10);
  handle(act, id, val, idx);
});
document.addEventListener("input", function(ev){
  var t = ev.target;
  if(!t || !t.getAttribute) return;
  var k = t.getAttribute("data-k");
  if(k){ S.intake[k] = t.value; }
  var pt = t.getAttribute("data-pt");
  if(pt !== null){ S.intake.points[parseInt(pt,10)] = t.value; }
});
document.addEventListener("change", function(ev){
  var t = ev.target;
  if(!t || !t.getAttribute) return;
  var k = t.getAttribute("data-k");
  if(k){ S.intake[k] = t.value; }
  if(t.name === "cause"){ updateCorrPreview(); }
});
document.addEventListener("click", function(ev){
  var t = ev.target;
  if(t && t.name === "cause"){ later(updateCorrPreview, 0); }
});
window.__ui = {
  state:function(){
    return {stage:S.stage, fixture:S.fixture, shots:S.shots?S.shots.length:0, gen:JSON.parse(JSON.stringify(S.genState)), adopted:adoptedCount(), scenario:S.scenario, stale:Object.keys(S.stale||{}).length, cands:S.shots?S.shots.map(function(s){return allCands(s.id).length;}):[]};
  },
  click:function(act, id, val){ handle(act, id||"", val||"", -1); },
  setScenario:setScenario
};
render();
</script>
</body>
